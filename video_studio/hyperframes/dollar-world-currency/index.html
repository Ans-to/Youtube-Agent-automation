<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"accent","type":"color","label":"Accent (dollar green)","default":"#2ee66b"},{"id":"gold","type":"color","label":"Gold","default":"#ffd166"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Why the Dollar Rules the World — 60s HyperFrames film</title>
    <script src="lib/gsap.min.js"></script>
    <script src="lib/three.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 400; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
      :root {
        --ground: #0b0f19;
        --ink: #f4f2ec;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { position: relative; width: 100%; height: 100%; }
      #ground {
        position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(1200px 700px at 50% 38%, rgba(46, 230, 107, 0.07), rgba(11, 15, 25, 0) 60%),
          radial-gradient(900px 600px at 82% 12%, rgba(76, 201, 240, 0.05), rgba(11, 15, 25, 0) 55%),
          #0b0f19;
      }
      .host { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #world3d { z-index: 1; }
      .scene-host { z-index: 2; }
      #hud { z-index: 3; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-qbnw" id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div data-hf-id="hf-7hg0" id="ground"></div>

      <!-- Continuous 3D world: never cuts, the camera carries every transition -->
      <div data-hf-id="hf-1w8q" id="world3d" class="host" data-composition-id="world3d" data-composition-src="compositions/world3d.html"
           data-start="0" data-duration="60" data-track-index="0" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>

      <!-- Kinetic-type chapters -->
      <div data-hf-id="hf-mt1t" id="s1-hook" class="host scene-host" data-composition-id="s1-hook" data-composition-src="compositions/s1-hook.html"
           data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-qz1r" id="s2-bretton" class="host scene-host" data-composition-id="s2-bretton" data-composition-src="compositions/s2-bretton.html"
           data-start="6" data-duration="8" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-o29g" id="s3-network" class="host scene-host" data-composition-id="s3-network" data-composition-src="compositions/s3-network.html"
           data-start="14" data-duration="9" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-v9ob" id="s4-petro" class="host scene-host" data-composition-id="s4-petro" data-composition-src="compositions/s4-petro.html"
           data-start="23" data-duration="9" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-hkwu" id="s5-trust" class="host scene-host" data-composition-id="s5-trust" data-composition-src="compositions/s5-trust.html"
           data-start="32" data-duration="9" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-orke" id="s6-power" class="host scene-host" data-composition-id="s6-power" data-composition-src="compositions/s6-power.html"
           data-start="41" data-duration="9" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-f58r" id="s7-finale" class="host scene-host" data-composition-id="s7-finale" data-composition-src="compositions/s7-finale.html"
           data-start="50" data-duration="10" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>

      <!-- Frame, chapters, progress -->
      <div data-hf-id="hf-riue" id="hud" class="host" data-composition-id="hud" data-composition-src="compositions/hud.html"
           data-start="0" data-duration="60" data-track-index="2" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>

      <!-- Synthesized score (tools/make_score.py). Voice drop-in: add
           <audio id="voiceover" src="assets/audio/voiceover.mp3" ...> — see README. -->
      <audio data-hf-id="hf-zzqm" id="score" class="clip" src="assets/audio/score.mp3"
             data-start="0" data-duration="60" data-track-index="3"
             data-volume="0.9" data-fade-out="0.8"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
