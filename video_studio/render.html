<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline Agent HQ Canvas Renderer</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0f}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="frame" width="1920" height="1080"></canvas>
<script>
(() => {
 const canvas=document.getElementById("frame"),ctx=canvas.getContext("2d",{alpha:false});
 const p={bg:"#0b0b0f",fg:"#f4f2ec",accent:"#c8ff3d",muted:"#a7a7b3",grid:"#24242c"};
 const RTL_SCRIPT=/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/;
 const TEXT_FONT='"Noto Naskh Arabic","Noto Nastaliq Urdu","Nirmala UI",Arial,sans-serif';
 function isRtlText(text){return RTL_SCRIPT.test(String(text||""))}
 function textDirection(text,profile){return isRtlText(text)?"rtl":"ltr"}
 function wrap(text,maxWidth,font,direction="ltr"){ctx.font=font;const oldDirection=ctx.direction,oldAlign=ctx.textAlign;ctx.direction=direction;ctx.textAlign=direction==="rtl"?"right":"left";const lines=[];let line="";for(const word of String(text||"").split(/\s+/)){const candidate=line?line+" "+word:word;if(ctx.measureText(candidate).width>maxWidth&&line){lines.push(line);line=word}else line=candidate}if(line)lines.push(line);ctx.direction=oldDirection;ctx.textAlign=oldAlign;return lines}
 function getCaptionPage(text,maxWidth,font,progress,direction="ltr"){
  const all=wrap(text,maxWidth,font,direction),perPage=2,pages=Math.max(1,Math.ceil(all.length/perPage));
  const index=Math.min(pages-1,Math.floor(Math.max(0,Math.min(.999999,progress))*pages));
  return {allLines:all,totalPages:pages,pageIndex:index,lines:all.slice(index*perPage,index*perPage+perPage)};
 }
 window.captionPageForTest=function(text,maxWidth,font,progress){return getCaptionPage(text,maxWidth,font,progress);};
 window.measureWrappedLines=function(text,maxWidth,font){return wrap(text,maxWidth,font).length;};
 function drawSceneGraphic(scene,progress,frame){
  const w=canvas.width,h=canvas.height,portrait=h>w,left=w*.078,contentW=w*.844;
  const type=String(scene.visual_type||"hero").toLowerCase();
  const gx=portrait?left:w*.665,gy=portrait?(type==="bar-chart"?h*.63:h*.68):h*.36,gw=portrait?contentW:w*.255,gh=portrait?(type==="bar-chart"?h*.14:h*.08):h*.315;
  const accent=p.accent,fg=p.fg,muted=p.muted,panel="#15151d",line="#454552";
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const rounded=(x,y,ww,hh,r,fill,stroke)=>{ctx.beginPath();ctx.roundRect(x,y,ww,hh,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}};
  const label=(text,x,y,size=18,color=fg,font="600")=>{ctx.font=font+" "+size+"px Arial";ctx.fillStyle=color;ctx.textAlign="center";ctx.fillText(String(text||"").slice(0,42),x,y);ctx.textAlign="left"};
  const nodes=Array.isArray(scene.visual_nodes)?scene.visual_nodes.map(v=>String(v).slice(0,24)).slice(0,4):[];
  const events=Array.isArray(scene.timeline_events)?scene.timeline_events.map(v=>String(v).slice(0,24)).slice(0,4):[];
  ctx.save();
  if(type==="stat"){
    rounded(gx,gy,gw,gh,14,panel,line);
    ctx.fillStyle=accent;ctx.fillRect(gx+14,gy+14,Math.max(28,gw*.12),4);
    label(scene.stat_value||"3.2×",gx+gw*.5,gy+gh*.56,Math.min(56,gw*.19),accent,"700");
    label(scene.stat_label||"MEASURED IMPACT",gx+gw*.5,gy+gh*.80,Math.max(12,Math.min(18,gw*.055)),muted,"600");
  }else if(type==="diagram"){
    const items=nodes.length?nodes:["INPUT","PROCESS","OUTPUT"],gap=gh*.07,nh=(gh-gap*(items.length-1))/items.length;
    ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.globalAlpha=.75;
    items.forEach((item,i)=>{
      const y=gy+i*(nh+gap),barW=gw*.90,x=gx+(gw-barW)/2;
      if(i>0){ctx.beginPath();ctx.moveTo(gx+gw*.5,y-gap);ctx.lineTo(gx+gw*.5,y-2);ctx.stroke();ctx.beginPath();ctx.moveTo(gx+gw*.5-5,y-7);ctx.lineTo(gx+gw*.5,y-2);ctx.lineTo(gx+gw*.5+5,y-7);ctx.stroke()}
      rounded(x,y,barW,nh,8,panel,line);
      ctx.fillStyle=accent;ctx.fillRect(x,y,4,nh);
      label(item,gx+gw*.5,y+nh*.58,Math.max(12,Math.min(19,gw*.055)),fg,"600");
    });
    ctx.globalAlpha=1;
  }else if(type==="timeline"){
    rounded(gx,gy,gw,gh,14,panel,line);
    const items=events.length?events:["PLAN","BUILD","REVIEW","SHIP"],y=gy+gh*.43,pad=gw*.10,usable=gw-pad*2;
    ctx.strokeStyle=line;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(gx+pad,y);ctx.lineTo(gx+pad+usable*clamp(progress,0,1),y);ctx.stroke();
    items.forEach((item,i)=>{const x=gx+pad+usable*(items.length===1?0:i/(items.length-1));ctx.beginPath();ctx.arc(x,y,Math.max(5,gw*.018),0,Math.PI*2);ctx.fillStyle=i/(Math.max(1,items.length-1))<=progress?accent:line;ctx.fill();label(item,x,y+gh*.25,Math.max(10,Math.min(16,gw*.043)),muted,"600")});
  }else if(type==="comparison"){
    rounded(gx,gy,gw,gh,14,panel,line);ctx.strokeStyle=line;ctx.beginPath();ctx.moveTo(gx+gw/2,gy+12);ctx.lineTo(gx+gw/2,gy+gh-12);ctx.stroke();
    label(scene.comparison_left_title||"BEFORE",gx+gw*.25,gy+gh*.28,Math.max(12,Math.min(17,gw*.05)),muted);
    label(scene.comparison_right_title||"AFTER",gx+gw*.75,gy+gh*.28,Math.max(12,Math.min(17,gw*.05)),accent);
    const a=Array.isArray(scene.comparison_left)?scene.comparison_left:["Manual","Slow","Scattered"];
    const b=Array.isArray(scene.comparison_right)?scene.comparison_right:["Automated","Faster","Consistent"];
    for(let i=0;i<3;i++){label(a[i]||"",gx+gw*.25,gy+gh*(.48+i*.16),Math.max(10,Math.min(15,gw*.043)),fg,"400");label(b[i]||"",gx+gw*.75,gy+gh*(.48+i*.16),Math.max(10,Math.min(15,gw*.043)),fg,"400")}
  }else if(type==="code"){
    rounded(gx,gy,gw,gh,12,"#0e1115",line);
    ctx.fillStyle="#252831";ctx.fillRect(gx,gy,gw,Math.max(20,gh*.14));
    for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(gx+12+i*12,gy+gh*.07,3,0,Math.PI*2);ctx.fillStyle=[p.accent,"#ff9a72","#77d7ff"][i];ctx.fill()}
    const lines=Array.isArray(scene.code_lines)?scene.code_lines.slice(0,6):["function render(frame) {","  drawScene(frame);","  return output;","}"];
    const fs=Math.max(10,Math.min(14,gw*.032)),start=gy+gh*.27;
    lines.forEach((ln,i)=>{ctx.font=fs+"px monospace";ctx.fillStyle=i===0?accent:(i%2?fg:muted);ctx.fillText(String(ln).slice(0,48),gx+12,start+i*fs*1.45)});
    if(Math.floor(frame/12)%2===0){ctx.fillStyle=accent;ctx.fillRect(gx+12,Math.min(gy+gh-7,start+lines.length*fs*1.45),8,2)}
  }else if(type==="quote"){
    rounded(gx,gy,gw,gh,14,panel,line);
    ctx.fillStyle=accent;ctx.font="700 "+Math.max(28,Math.min(54,gw*.15))+"px Georgia";ctx.fillText("“",gx+14,gy+gh*.43);
    const quote=String(scene.quote||scene.stat_label||"The clearest idea wins.").slice(0,180);
    const quoteLines=wrap(quote,gw-28,"italic "+Math.max(13,Math.min(19,gw*.05))+"px Arial").slice(0,4);
    ctx.font="italic "+Math.max(13,Math.min(19,gw*.05))+"px Arial";ctx.fillStyle=fg;
    quoteLines.forEach((line,i)=>ctx.fillText(line,gx+14,gy+gh*.57+i*Math.max(16,gh*.09)));
    if(scene.quote_source)label(scene.quote_source,gx+gw*.53,gy+gh*.91,Math.max(10,Math.min(13,gw*.036)),muted,"400");
  }else if(type==="bar-chart"){
    rounded(gx,gy,gw,gh,14,panel,line);
    const values=Array.isArray(scene.chart_values)?scene.chart_values.slice(0,6):[4,7,5,9],labels=Array.isArray(scene.chart_labels)?scene.chart_labels.slice(0,6):["A","B","C","D"],maxValue=Math.max(1,...values.map(v=>Number(v)||0));
    const plotLeft=gx+gw*.08,plotRight=gx+gw*.94,baseY=gy+gh*.78,plotHeight=gh*.52,slot=(plotRight-plotLeft)/Math.max(1,values.length),bw=slot*.52;
    ctx.strokeStyle=line;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(plotLeft,baseY);ctx.lineTo(plotRight,baseY);ctx.stroke();
    values.forEach((value,i)=>{const numeric=Math.max(0,Number(value)||0),targetHeight=plotHeight*numeric/maxValue,bh=targetHeight*progress,x=plotLeft+i*slot+(slot-bw)/2,y=baseY-bh;ctx.fillStyle=i===values.indexOf(maxValue)?accent:"#8c78c8";ctx.globalAlpha=.55+.45*progress;ctx.fillRect(x,y,bw,bh);ctx.globalAlpha=1;label(String(value),x+bw/2,Math.max(gy+18,y-7),Math.max(9,Math.min(13,gw*.032)),fg,"600");label(labels[i]||"",x+bw/2,baseY+Math.max(13,gh*.07),Math.max(9,Math.min(13,gw*.032)),muted,"400")});
  }else if(type==="kinetic-type"){
    rounded(gx,gy,gw,gh,14,panel,line);
    const words=String(scene.headline||"MAKE IT MOVE").split(/\s+/).slice(0,4),gap=gw*.035,cell=(gw-gap*(words.length+1))/Math.max(1,words.length);
    words.forEach((word,i)=>{const t=clamp((progress*words.length-i)*1.5,0,1),x=gx+gap+i*(cell+gap),hh=gh*.60*t,y=gy+gh*.70-hh;ctx.globalAlpha=.35+.65*t;rounded(x,y,cell,hh,7,i%2===0?accent:"#48415f",line);label(word,x+cell*.5,Math.max(gy+18,y+hh*.62),Math.max(9,Math.min(14,cell*.14)),i%2===0? "#0b0b0f":fg,"700");ctx.globalAlpha=1});
  }else if(type==="waveform"){
    rounded(gx,gy,gw,gh,14,panel,line);
    const count=portrait?32:24,barGap=gw/(count*1.7),barWidth=Math.max(2,barGap*.68),mid=gy+gh*.52;
    for(let i=0;i<count;i++){const amplitude=(.12+.35*Math.abs(Math.sin(i*.57+frame*.09)))*(0.45+0.55*progress),bh=amplitude*gh;const x=gx+gw*.06+i*(barGap*1.5);ctx.globalAlpha=.5+.5*(i/count);ctx.fillStyle=i/count<progress?accent:muted;ctx.fillRect(x,mid-bh/2,barWidth,bh)}
    ctx.globalAlpha=1;
  }else{
    const cx=gx+gw*.5,cy=gy+gh*.48,r=Math.min(gw,gh)*(.22+.025*Math.sin(frame*.09));
    ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.globalAlpha=.8;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(cx,cy,r*(1+i*.48),0,Math.PI*2);ctx.stroke()}
    ctx.globalAlpha=1;
    label(scene.graphic_label||"CORE IDEA",cx,gy+gh*.92,Math.max(10,Math.min(15,gw*.045)),muted);
  }
  ctx.restore();
 }

 function easeSmooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}
 function drawCharacter(c,progress,frame){
  if(!c||c.enabled!==true)return;
  const portrait=canvas.height>canvas.width,w=canvas.width,h=canvas.height;
  const scale=Math.min(w,h)*(Number(c.scale)||0.22),cx=w*(Number(c.x)|| (portrait?0.5:0.82)),cy=h*(Number(c.y)||(portrait?0.70:0.56));
  const bob=Math.sin(frame*0.10)*scale*.018,breath=Math.sin(frame*.055)*scale*.012,gesture=easeSmooth((progress-.15)/.28)*(1-easeSmooth((progress-.68)/.18));
  const skin=c.skin||"#c58e72",hair=c.hair||"#25212a",shirt=c.shirt||"#6479b8",trousers=c.trousers||"#303746",line=c.outline||"#15151d";
  const limb=(x1,y1,x2,y2,x3,y3,width,color)=>{ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=line;ctx.lineWidth=width+scale*.035;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.stroke();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.stroke()};
  ctx.save();ctx.translate(cx,cy+bob);
  // Feet and legs: a restrained alternating walk/idle cycle.
  const walk=Number(c.walking)===1?Math.sin(frame*.12)*scale*.09:Math.sin(frame*.045)*scale*.012;
  limb(-scale*.13,scale*.18,-scale*.16+walk,scale*.43, -scale*.19+walk,scale*.65,scale*.085,trousers);
  limb(scale*.13,scale*.18,scale*.16-walk,scale*.43,scale*.20-walk,scale*.65,scale*.085,trousers);
  ctx.fillStyle="#171821";ctx.beginPath();ctx.ellipse(-scale*.20+walk,scale*.67,scale*.12,scale*.045,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(scale*.21-walk,scale*.67,scale*.12,scale*.045,0,0,Math.PI*2);ctx.fill();
  // Arms with an eased explanatory gesture.
  const leftHandX=-scale*.31-gesture*scale*.20,leftHandY=scale*.18-gesture*scale*.24;
  const rightHandX=scale*.37+gesture*scale*.16,rightHandY=scale*.15-gesture*scale*.26;
  limb(-scale*.22,-scale*.18,-scale*.35,scale*.02,leftHandX,leftHandY,scale*.065,shirt);
  limb(scale*.22,-scale*.18,scale*.34+gesture*scale*.10,scale*.02-gesture*scale*.17,rightHandX,rightHandY,scale*.065,shirt);
  // Hands and fingertips are separate shapes, keeping the gesture silhouette readable.
  for(const [hx,hy,rotation] of [[leftHandX,leftHandY,-.25],[rightHandX,rightHandY,.20]]){
   ctx.fillStyle=skin;ctx.strokeStyle=line;ctx.lineWidth=scale*.012;
   ctx.beginPath();ctx.ellipse(hx,hy,scale*.055,scale*.043,rotation,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.strokeStyle=skin;ctx.lineWidth=scale*.012;
   for(let finger=0;finger<3;finger++){
    const fx=hx+(finger-1)*scale*.022;
    ctx.beginPath();ctx.moveTo(fx,hy+scale*.012);ctx.lineTo(fx+rotation*scale*.025,hy+scale*.033);ctx.stroke();
   }
  }
  // Torso and neck.
  ctx.fillStyle=shirt;ctx.strokeStyle=line;ctx.lineWidth=scale*.018;ctx.beginPath();ctx.moveTo(-scale*.21,-scale*.23);ctx.quadraticCurveTo(0,-scale*.31,scale*.21,-scale*.23);ctx.lineTo(scale*.19,scale*.20);ctx.quadraticCurveTo(0,scale*.27,-scale*.19,scale*.20);ctx.closePath();ctx.fill();ctx.stroke();
  // Collar, seam, pocket, buttons, and restrained fabric highlights add readable clothing structure.
  ctx.strokeStyle="rgba(244,242,236,0.72)";ctx.lineWidth=scale*.012;ctx.beginPath();ctx.moveTo(-scale*.075,-scale*.255);ctx.lineTo(0,-scale*.19);ctx.lineTo(scale*.075,-scale*.255);ctx.stroke();
  ctx.strokeStyle="rgba(21,21,29,0.55)";ctx.lineWidth=scale*.009;ctx.beginPath();ctx.moveTo(0,-scale*.18);ctx.lineTo(0,scale*.19);ctx.stroke();
  ctx.strokeStyle="rgba(244,242,236,0.50)";ctx.lineWidth=scale*.010;ctx.strokeRect(-scale*.135,-scale*.075,scale*.07,scale*.075);
  for(const by of [-scale*.075,scale*.005,scale*.085]){ctx.fillStyle=p.accent;ctx.beginPath();ctx.arc(scale*.025,by,scale*.008,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle=skin;ctx.fillRect(-scale*.055,-scale*.34+breath,scale*.11,scale*.12);
  // Head and hair.
  const headY=-scale*.48+breath+Math.sin(progress*Math.PI*2)*scale*.004,headW=scale*.18,headH=scale*.22;
  ctx.fillStyle=skin;ctx.strokeStyle=line;ctx.lineWidth=scale*.014;ctx.beginPath();ctx.ellipse(0,headY,headW,headH,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle=hair;ctx.beginPath();ctx.moveTo(-headW*1.02,headY);ctx.quadraticCurveTo(-headW*1.1,headY-headH*1.3,0,headY-headH*1.12);ctx.quadraticCurveTo(headW*1.12,headY-headH*1.1,headW,headY-headH*.2);ctx.lineTo(headW*.55,headY-headH*.36);ctx.lineTo(headW*.18,headY-headH*.13);ctx.lineTo(-headW*.25,headY-headH*.33);ctx.lineTo(-headW*.7,headY-headH*.16);ctx.closePath();ctx.fill();
  ctx.strokeStyle="rgba(244,242,236,0.24)";ctx.lineWidth=scale*.009;ctx.beginPath();ctx.moveTo(-headW*.62,headY-headH*.68);ctx.quadraticCurveTo(-headW*.18,headY-headH*1.02,headW*.43,headY-headH*.76);ctx.stroke();
  // Ears, gaze saccades, expression-aware brows, and a subtle nose line.
  const blink=(frame%173>168&&frame%173<172)?0.15:1;
  const gazeX=Math.sin(frame*.031)*headW*.05,gazeY=Math.sin(frame*.019)*headH*.035;
  const expression=String(c.expression||"confident").toLowerCase();
  const browLift=expression==="curious"?-headH*.07:(expression==="concerned"?headH*.055:(expression==="focused"?headH*.025:0));
  for(const ex of [-1,1]){
   ctx.fillStyle=skin;ctx.strokeStyle=line;ctx.lineWidth=scale*.010;ctx.beginPath();ctx.ellipse(ex*headW*.98,headY+headH*.10,headW*.11,headH*.15,0,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.fillStyle="#f4f2ec";ctx.beginPath();ctx.ellipse(ex*headW*.39,headY,headW*.19,headH*.13*blink,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#292b39";ctx.beginPath();ctx.arc(ex*headW*.39+gazeX,headY+gazeY,headW*.07,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle=hair;ctx.lineWidth=scale*.014;ctx.beginPath();ctx.moveTo(ex*headW*.57,headY-headH*.23+browLift);ctx.quadraticCurveTo(ex*headW*.39,headY-headH*.34+browLift,ex*headW*.20,headY-headH*.26+browLift);ctx.stroke();
  }
  ctx.strokeStyle="#8f5f50";ctx.lineWidth=scale*.009;ctx.beginPath();ctx.moveTo(0,headY+headH*.03);ctx.lineTo(scale*.008,headY+headH*.20);ctx.stroke()
  // Smoothly blend viseme geometry between timestamped cues; never snap the mouth shape frame-to-frame.
  const vis=(Array.isArray(c.visemes)?c.visemes:[]).filter(v=>Number.isFinite(Number(v.t))&&Number(v.t)>=0&&Number(v.t)<=1&&["closed","open","wide","round"].includes(String(v.shape))).slice().sort((a,b)=>Number(a.t)-Number(b.t));
  const geometry={closed:[.22,.006],open:[.30,.023],wide:[.48,.018],round:[.24,.025]};
  let mouthW=.27,mouthH=.018;
  if(vis.length){
   let before=vis[0],after=vis[vis.length-1];
   for(let i=0;i<vis.length;i++){if(Number(vis[i].t)<=progress)before=vis[i];if(Number(vis[i].t)>=progress){after=vis[i];break}}
   const a=geometry[String(before.shape)],b=geometry[String(after.shape)],span=Number(after.t)-Number(before.t);
   const raw=span>0?Math.max(0,Math.min(1,(progress-Number(before.t))/span)):1,q=raw*raw*(3-2*raw);
   mouthW=a[0]+(b[0]-a[0])*q;mouthH=a[1]+(b[1]-a[1])*q;
  }else if(c.speaking===true){
   const jaw=(.5-.5*Math.cos(2*Math.PI*3.2*progress));
   mouthW=.23+.06*jaw;mouthH=.006+.017*jaw;
  }
  const my=headY+headH*.55,mw=headW*mouthW,mh=scale*mouthH;
  ctx.fillStyle="#562e32";ctx.beginPath();ctx.ellipse(0,my,mw,mh,0,0,Math.PI*2);ctx.fill();
  if(mouthH>.019){ctx.fillStyle="#f3e8de";ctx.fillRect(-mw*.65,my-mh*.22,mw*1.3,mh*.28)}
  ctx.restore();
 }
 window.drawCharacterForTest=drawCharacter;
 async function drawTransitionFrame(previous,previousFrame,previousCount,previousGlobal,current,currentFrame,currentCount,currentGlobal,kind,t){
  window.drawFrame(previous,previousFrame,previousCount,previousGlobal,true);
  const outgoing=new Image();outgoing.src=canvas.toDataURL("image/png");await outgoing.decode();
  window.drawFrame(current,currentFrame,currentCount,currentGlobal,true);
  const incoming=new Image();incoming.src=canvas.toDataURL("image/png");await incoming.decode();
  const q=easeSmooth(t),w=canvas.width,h=canvas.height;ctx.save();
  if(kind==="fade"){ctx.globalAlpha=1-q;ctx.drawImage(outgoing,0,0,w,h);}
  else if(kind==="wipe-left"||kind==="wipe-right"){const width=w*(1-q);ctx.beginPath();ctx.rect(kind==="wipe-left"?w-width:0,0,width,h);ctx.clip();ctx.drawImage(outgoing,0,0,w,h);}
  else if(kind==="slide-left"||kind==="slide-right"){
   ctx.drawImage(outgoing,0,0,w,h);
   const offset=(1-q)*w*(kind==="slide-left"?1:-1);
   ctx.drawImage(incoming,offset,0,w,h);
  }else if(kind==="zoom"){
   ctx.drawImage(outgoing,0,0,w,h);ctx.globalAlpha=q;ctx.translate(w/2,h/2);
   const scale=.92+.08*q;ctx.scale(scale,scale);ctx.drawImage(incoming,-w/2,-h/2,w,h);
  }else{ctx.globalAlpha=1-q;ctx.drawImage(outgoing,0,0,w,h);}
  ctx.restore();
 }
 window.drawTransitionFrame=drawTransitionFrame;

 window.setCanvasSize=function(width,height){if(!Number.isInteger(width)||!Number.isInteger(height)||width<320||height<180||width>3840||height>2160)throw new Error("Invalid canvas dimensions");canvas.width=width;canvas.height=height;};
  window.drawFrame=function(scene,localFrame,sceneFrames,globalFrame,suppressTransition){
  const w=canvas.width,h=canvas.height,portrait=h>w,progress=sceneFrames<=1?1:localFrame/(sceneFrames-1),pulse=.5+.5*Math.sin(globalFrame/30*Math.PI*1.2);
   const left=w*.078,contentW=w*.844,textW=portrait?contentW:(String(scene.visual_type||"hero")==="hero"?w*.66:w*.49),grid=Math.max(24,Math.round(w/30)),fontSize=portrait?Math.min(72,w*.07):Math.min(88,w*.046),eyebrowY=portrait?h*.31:h*.19,headlineY=portrait?h*.43:h*.46,subY=portrait?h*.59:h*.60,barY=portrait?h*.78:h*.73,footerY=h*.91,barW=contentW*.58;
