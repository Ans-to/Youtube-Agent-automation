<body><canvas id="frame" width="1920" height="1080"></canvas>
<script>
(() => {
 const canvas=document.getElementById("frame"),ctx=canvas.getContext("2d",{alpha:false});
 const p={bg:"#0b0b0f",panel:"#15151d",fg:"#f4f2ec",accent:"#c8ff3d",muted:"#a7a7b3",support:"#8FB3FF",grid:"#24242c",line:"#454552",scrim:"#111119",light:false};
 const GRADE={vignette:0.16,grain:0.02,bloom:0.10,contrast:1.04};
 const EASING_ROLES={primary:"editorial",entrance:"entrance",exit:"exit",accent:"settle"};
 let FRAME_RATE=30;
 let grainPattern=null;
 function hexToRgba(hex,alpha){
  const raw=String(hex||"#ffffff").replace("#","");
  const value=raw.length===3?raw.split("").map(ch=>ch+ch).join(""):raw.padEnd(6,"0");
  const red=parseInt(value.slice(0,2),16),green=parseInt(value.slice(2,4),16),blue=parseInt(value.slice(4,6),16);
  return "rgba("+red+","+green+","+blue+","+Math.max(0,Math.min(1,alpha))+")";
 }
 function ensureGrain(){
  if(grainPattern)return;
  const tile=document.createElement("canvas");tile.width=160;tile.height=160;
  const grit=tile.getContext("2d"),image=grit.createImageData(160,160),data=image.data;
  let seed=1234567;
  for(let index=0;index<data.length;index+=4){
   seed=(seed*1103515245+12345)&0x7fffffff;
   const value=(seed>>>16)&255;
   data[index]=data[index+1]=data[index+2]=value;data[index+3]=255;
  }
  grit.putImageData(image,0,0);
  grainPattern=ctx.createPattern(tile,"repeat");
 }
 const RTL_SCRIPT=/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/;
 let TEXT_FONT='"Inter","Noto Naskh Arabic","Noto Nastaliq Urdu","Nirmala UI","Helvetica Neue",Arial,sans-serif';
 let DISPLAY_FONT='"Space Grotesk","Inter","Noto Naskh Arabic","Nirmala UI","Helvetica Neue",Arial,sans-serif';
 function isRtlText(text){return RTL_SCRIPT.test(String(text||""))}
 function textDirection(text,profile){return isRtlText(text)?"rtl":"ltr"}
 window.textDirectionForTest=function(text){return textDirection(text, "");};
 function wrap(text,maxWidth,font,direction="ltr"){ctx.font=font;const oldDirection=ctx.direction,oldAlign=ctx.textAlign;ctx.direction=direction;ctx.textAlign=direction==="rtl"?"right":"left";const lines=[];let line="";for(const word of String(text||"").split(/\s+/)){const candidate=line?line+" "+word:word;if(ctx.measureText(candidate).width>maxWidth&&line){lines.push(line);line=word}else line=candidate}if(line)lines.push(line);ctx.direction=oldDirection;ctx.textAlign=oldAlign;return lines}
 function getCaptionPage(text,maxWidth,font,progress,direction="ltr"){
  const all=wrap(text,maxWidth,font,direction),perPage=2,pages=Math.max(1,Math.ceil(all.length/perPage));
  const index=Math.min(pages-1,Math.floor(Math.max(0,Math.min(.999999,progress))*pages));
  return {allLines:all,totalPages:pages,pageIndex:index,lines:all.slice(index*perPage,index*perPage+perPage)};
 }
 window.captionPageForTest=function(text,maxWidth,font,progress){return getCaptionPage(text,maxWidth,font,progress);};
 window.measureWrappedLines=function(text,maxWidth,font){return wrap(text,maxWidth,font).length;};
 function drawSceneGraphic(scene,progress,frame){
  const w=canvas.width,h=canvas.height,portrait=h>w,left=w*.078,contentW=w*.844;
  const type=String(scene.visual_type||"hero").toLowerCase();
  const gx=portrait?left:w*.635,gy=portrait?(type==="bar-chart"?h*.63:h*.68):h*.36,gw=portrait?contentW:w*.225,gh=portrait?(type==="bar-chart"?h*.14:h*.08):h*.315;
  const accent=p.accent,fg=p.fg,muted=p.muted,panel=p.panel,line=p.line;
  // Graphic typography scales with the canvas so 4K does not render 12 px labels.
  const gs=Math.max(.7,w/1920);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const rounded=(x,y,ww,hh,r,fill,stroke)=>{ctx.beginPath();ctx.roundRect(x,y,ww,hh,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1,1.5*gs);ctx.stroke()}};
  const label=(text,x,y,size=18,color=fg,font="600")=>{ctx.font=font+" "+size+"px "+TEXT_FONT;ctx.fillStyle=color;ctx.textAlign="center";ctx.fillText(String(text||"").slice(0,42),x,y);ctx.textAlign="left"};
  const nodes=Array.isArray(scene.visual_nodes)?scene.visual_nodes.map(v=>String(v).slice(0,24)).slice(0,4):[];
  const events=Array.isArray(scene.timeline_events)?scene.timeline_events.map(v=>String(v).slice(0,24)).slice(0,4):[];
  ctx.save();
  // A unified eased scale-in makes each information layer enter with intent instead of appearing as a static card.
  const reveal=easeSmooth(clamp(progress/0.24,0,1)),graphicScale=0.94+0.06*reveal;
  ctx.translate(gx+gw*.5,gy+gh*.5);ctx.scale(graphicScale,graphicScale);ctx.translate(-(gx+gw*.5),-(gy+gh*.5));
  if(type==="kinetic-type"){
   // The typography is the graphic. Drawing a second card here would compete with the headline.
  }else if(type==="stat"){
    rounded(gx,gy,gw,gh,14,panel,line);
    ctx.fillStyle=accent;ctx.fillRect(gx+14,gy+14,Math.max(28,gw*.12),4);
    label(scene.stat_value||"3.2×",gx+gw*.5,gy+gh*.56,Math.min(56*gs,gw*.19),accent,"700");
    label(scene.stat_label||"MEASURED IMPACT",gx+gw*.5,gy+gh*.80,Math.max(12,Math.min(18*gs,gw*.055)),muted,"600");
  }else if(type==="diagram"){
    const items=nodes.length?nodes:["INPUT","PROCESS","OUTPUT"],gap=gh*.07,nh=(gh-gap*(items.length-1))/items.length;
    ctx.strokeStyle=accent;ctx.lineWidth=Math.max(1.5,2*gs);ctx.globalAlpha=.75;
    items.forEach((item,i)=>{
      const nodeProgress=easeSmooth(clamp((progress-i*.17)/.28,0,1));
      const y=gy+i*(nh+gap)+(1-nodeProgress)*Math.min(18,nh*.22),barW=gw*.90*nodeProgress,x=gx+(gw-barW)/2;
      ctx.save();ctx.globalAlpha=nodeProgress;
      if(i>0&&nodeProgress>.02){ctx.beginPath();ctx.moveTo(gx+gw*.5,y-gap);ctx.lineTo(gx+gw*.5,y-2);ctx.stroke();ctx.beginPath();ctx.moveTo(gx+gw*.5-5*gs,y-7*gs);ctx.lineTo(gx+gw*.5,y-2*gs);ctx.lineTo(gx+gw*.5+5*gs,y-7*gs);ctx.stroke()}
      rounded(x,y,barW,nh,8,panel,line);
      ctx.fillStyle=accent;ctx.fillRect(x,y,4,nh);
      label(item,gx+gw*.5,y+nh*.58,Math.max(12,Math.min(19*gs,gw*.055)),fg,"600");
      ctx.restore();
    });
    ctx.globalAlpha=1;
  }else if(type==="timeline"){
    rounded(gx,gy,gw,gh,14,panel,line);
    const items=events.length?events:["PLAN","BUILD","REVIEW","SHIP"],y=gy+gh*.43,pad=gw*.10,usable=gw-pad*2;
    ctx.strokeStyle=line;ctx.lineWidth=Math.max(2,3*gs);ctx.beginPath();ctx.moveTo(gx+pad,y);ctx.lineTo(gx+pad+usable*clamp(progress,0,1),y);ctx.stroke();
    items.forEach((item,i)=>{const x=gx+pad+usable*(items.length===1?0:i/(items.length-1));ctx.beginPath();ctx.arc(x,y,Math.max(5,Math.max(5*gs,gw*.018)),0,Math.PI*2);ctx.fillStyle=i/(Math.max(1,items.length-1))<=progress?accent:line;ctx.fill();label(item,x,y+gh*.25,Math.max(10,Math.min(16*gs,gw*.043)),muted,"600")});
  }else if(type==="comparison"){
    rounded(gx,gy,gw,gh,14,panel,line);ctx.strokeStyle=line;ctx.beginPath();ctx.moveTo(gx+gw/2,gy+12);ctx.lineTo(gx+gw/2,gy+gh-12);ctx.stroke();
    label(scene.comparison_left_title||"BEFORE",gx+gw*.25,gy+gh*.28,Math.max(12,Math.min(17*gs,gw*.05)),muted);
    label(scene.comparison_right_title||"AFTER",gx+gw*.75,gy+gh*.28,Math.max(12,Math.min(17*gs,gw*.05)),accent);
    const a=Array.isArray(scene.comparison_left)?scene.comparison_left:["Manual","Slow","Scattered"];
    const b=Array.isArray(scene.comparison_right)?scene.comparison_right:["Automated","Faster","Consistent"];
    for(let i=0;i<3;i++){label(a[i]||"",gx+gw*.25,gy+gh*(.48+i*.16),Math.max(10,Math.min(15*gs,gw*.043)),fg,"400");label(b[i]||"",gx+gw*.75,gy+gh*(.48+i*.16),Math.max(10,Math.min(15*gs,gw*.043)),fg,"400")}
  }else if(type==="code"){
    rounded(gx,gy,gw,gh,12,panel,line);
    ctx.fillStyle=hexToRgba(line,.45);ctx.fillRect(gx,gy,gw,Math.max(20,gh*.14));
    for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(gx+12+i*12,gy+gh*.07,3,0,Math.PI*2);ctx.fillStyle=[p.accent,p.support,p.muted][i];ctx.fill()}
    const lines=Array.isArray(scene.code_lines)?scene.code_lines.slice(0,6):["function render(frame) {","  drawScene(frame);","  return output;","}"];
    const fs=Math.max(10,Math.min(14*gs,gw*.032)),start=gy+gh*.27;
    lines.forEach((ln,i)=>{const lineT=easeSmooth(clamp((progress-i*.12)/.24,0,1));ctx.save();ctx.globalAlpha=lineT;ctx.font=fs+"px "+TEXT_FONT;ctx.fillStyle=i===0?accent:(i%2?fg:muted);ctx.fillText(String(ln).slice(0,48),gx+12+(1-lineT)*10,start+i*fs*1.45);ctx.restore()});
    if(Math.floor(frame/12)%2===0){ctx.fillStyle=accent;ctx.fillRect(gx+12,Math.min(gy+gh-7,start+lines.length*fs*1.45),8,2)}
  }else if(type==="quote"){
    rounded(gx,gy,gw,gh,14,panel,line);
    ctx.fillStyle=accent;ctx.font="700 "+Math.max(28,Math.min(54*gs,gw*.15))+"px "+DISPLAY_FONT;ctx.fillText("“",gx+14,gy+gh*.43);
    const quote=String(scene.quote||scene.stat_label||"The clearest idea wins.").slice(0,180);
    const quoteSize=Math.max(13,Math.min(19*gs,gw*.05)),quoteLines=wrap(quote,gw-28,"italic "+quoteSize+"px "+TEXT_FONT).slice(0,4);
    ctx.font="italic "+quoteSize+"px "+TEXT_FONT;ctx.fillStyle=fg;
    quoteLines.forEach((line,i)=>ctx.fillText(line,gx+14,gy+gh*.57+i*Math.max(16,gh*.09)));
    if(scene.quote_source)label(scene.quote_source,gx+gw*.53,gy+gh*.91,Math.max(10,Math.min(13*gs,gw*.036)),muted,"400");
  }else if(type==="bar-chart"){
    rounded(gx,gy,gw,gh,14,panel,line);
    const values=Array.isArray(scene.chart_values)?scene.chart_values.slice(0,6):[4,7,5,9],labels=Array.isArray(scene.chart_labels)?scene.chart_labels.slice(0,6):["A","B","C","D"],maxValue=Math.max(1,...values.map(v=>Number(v)||0));
    const plotLeft=gx+gw*.08,plotRight=gx+gw*.94,baseY=gy+gh*.78,plotHeight=gh*.52,slot=(plotRight-plotLeft)/Math.max(1,values.length),bw=slot*.52;
    ctx.strokeStyle=line;ctx.lineWidth=Math.max(1,1.5*gs);ctx.beginPath();ctx.moveTo(plotLeft,baseY);ctx.lineTo(plotRight,baseY);ctx.stroke();
    values.forEach((value,i)=>{
      const numeric=Math.max(0,Number(value)||0),delay=i*.07,localT=Math.max(0,Math.min(1,(progress-delay)/Math.max(.01,1-delay))),barProgress=localT*localT*(3-2*localT);
      const targetHeight=plotHeight*numeric/maxValue,bh=targetHeight*barProgress,x=plotLeft+i*slot+(slot-bw)/2,y=baseY-bh;
      ctx.fillStyle=i===values.indexOf(maxValue)?accent:p.support;ctx.globalAlpha=.55+.45*barProgress;ctx.fillRect(x,y,bw,bh);ctx.globalAlpha=1;
      label(String(Math.round(numeric*barProgress)),x+bw/2,Math.max(gy+18,y-7),Math.max(9,Math.min(13*gs,gw*.032)),fg,"600");
      label(labels[i]||"",x+bw/2,baseY+Math.max(13,gh*.07),Math.max(9,Math.min(13*gs,gw*.032)),muted,"400")
    });
  }else if(type==="waveform"){
    rounded(gx,gy,gw,gh,14,panel,line);
    const count=portrait?32:24,barGap=gw/(count*1.7),barWidth=Math.max(2,barGap*.68),mid=gy+gh*.52;
    const envelope=Array.isArray(scene.audio_envelope)?scene.audio_envelope:[];
    for(let i=0;i<count;i++){
      const envelopeIndex=envelope.length?Math.max(0,Math.min(envelope.length-1,Math.round(progress*(envelope.length-1)+(i-(count-1)/2)))):0;
      const energy=envelope.length?clamp(Number(envelope[envelopeIndex])||0,0,1):Math.abs(Math.sin(i*.57+frame*.09));
      const amplitude=envelope.length ? (.08+.42*energy) : (.12+.35*energy)*(0.45+0.55*progress),bh=amplitude*gh,x=gx+gw*.06+i*(barGap*1.5);
      ctx.globalAlpha=.5+.5*(i/count);ctx.fillStyle=i/count<progress?accent:muted;ctx.fillRect(x,mid-bh/2,barWidth,bh)
    }
    ctx.globalAlpha=1;
  }else{
    const cx=gx+gw*.5,cy=gy+gh*.48,r=Math.min(gw,gh)*(.22+.025*Math.sin(frame*.09));
    ctx.strokeStyle=accent;ctx.lineWidth=Math.max(1.5,2*gs);ctx.globalAlpha=.8;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(cx,cy,r*(1+i*.48),0,Math.PI*2);ctx.stroke()}
    ctx.globalAlpha=1;
    const orbitOuter=r*1.96,labelY=Math.min(gy+gh*.98,cy+orbitOuter+Math.max(20,24*gs));
    label(scene.graphic_label||"CORE IDEA",cx,labelY,Math.max(11,Math.min(15*gs,gw*.045)),muted);
  }
  ctx.restore();
 }

 function captionLayout(width,height,left,contentWidth){
  const portrait=height>width;
  // Landscape captions stay in the editorial text lane and never paint over the presenter.
  // Portrait captions use the full safe-width because the presenter occupies the upper/middle frame.
  return {x:left,width:portrait?contentWidth:Math.min(contentWidth,width*.59),portrait};
 }
 window.captionLayoutForTest=captionLayout;
 function clamp01(t){return Math.max(0,Math.min(1,Number(t)||0))}
 function bezierAxis(t,a1,a2){const u=1-t;return 3*u*u*t*a1+3*u*t*t*a2+t*t*t}
 function bezierSlope(t,a1,a2){const u=1-t;return 3*u*u*a1+6*u*t*(a2-a1)+3*t*t*(1-a2)}
 function bezierEase(x,x1,y1,x2,y2){
  if(x<=0)return 0;if(x>=1)return 1;
  let t=x;
  for(let i=0;i<7;i++){const error=bezierAxis(t,x1,x2)-x;if(Math.abs(error)<1e-7)break;const slope=bezierSlope(t,x1,x2);if(Math.abs(slope)<1e-7)break;t=clamp01(t-error/slope)}
  let low=0,high=1;
  for(let i=0;i<32;i++){const mid=(low+high)*.5;if(bezierAxis(mid,x1,x2)<x)low=mid;else high=mid}
  return bezierAxis((low+high)*.5,y1,y2);
 }
 const CURVES={editorial:[.65,0,.35,1],entrance:[.16,1,.30,1],exit:[.70,0,.84,0],settle:[.22,1.35,.36,1],snap:[.40,0,.20,1],glide:[.45,.05,.55,.95],dramatic:[.83,0,.17,1]};
 function ease(name,t){const c=CURVES[name]||CURVES.editorial;return bezierEase(clamp01(t),c[0],c[1],c[2],c[3])}
 function easeSmooth(t){return ease(EASING_ROLES.primary,t)}
 function anticipationOffset(progress,lead,amount){const p=clamp01(progress);if(p<=0)return 0;if(p<lead)return -amount*ease("entrance",p/lead);if(p<2*lead)return -amount*(1-ease("editorial",(p-lead)/lead));return 0}
 function applyStyle(style){
  if(!style||typeof style!=="object")return;
  const pal=style.palette&&typeof style.palette==="object"?style.palette:{};
  for(const key of ["bg","panel","fg","muted","accent","support","grid","line","scrim"])if(typeof pal[key]==="string")p[key]=pal[key];
  if(typeof pal.light==="boolean")p.light=pal.light;
  const grade=style.grade&&typeof style.grade==="object"?style.grade:{};
  if(Number.isFinite(Number(grade.vignette)))GRADE.vignette=Math.max(0,Math.min(.4,Number(grade.vignette)));
  if(Number.isFinite(Number(grade.grain)))GRADE.grain=Math.max(0,Math.min(.08,Number(grade.grain)));
  if(Number.isFinite(Number(grade.bloom)))GRADE.bloom=Math.max(0,Math.min(.3,Number(grade.bloom)));
  if(Number.isFinite(Number(grade.contrast)))GRADE.contrast=Math.max(.9,Math.min(1.2,Number(grade.contrast)));
  const easing=style.easing&&typeof style.easing==="object"?style.easing:{};
  for(const role of Object.keys(EASING_ROLES))if(CURVES[easing[role]])EASING_ROLES[role]=easing[role];
  const type=style.typography&&typeof style.typography==="object"?style.typography:{};
  if(typeof type.text_stack==="string"&&type.text_stack.includes("Inter"))TEXT_FONT=type.text_stack;
  if(typeof type.display_stack==="string"&&type.display_stack.includes("Space Grotesk"))DISPLAY_FONT=type.display_stack;
 }
 window.setStyle=applyStyle;
 window.setFrameRate=function(fps){const value=Number(fps);if(Number.isInteger(value)&&value>=1&&value<=60)FRAME_RATE=value};
 window.easeForTest=function(name,t){return ease(name,t)};
 window.anticipationForTest=anticipationOffset;
 window.motionCapabilitiesForTest=()=>({curves:Object.keys(CURVES),easingRoles:Object.assign({},EASING_ROLES),transitions:["cut","whip-pan","masked-reveal","morph","glitch","match-cut","fade","wipe-left","wipe-right","slide-left","slide-right","zoom","push","dissolve"],grade:Object.assign({},GRADE),frameRate:FRAME_RATE});
 function cameraTransformFor(scene,progress,width,height){
  const mode=String(scene&&scene.camera_motion||"static").toLowerCase(),q=easeSmooth(progress),ported=height>width;
  let scale=1,offsetX=0,offsetY=0,rotation=0;
  if(mode==="push-in")scale=1+.075*q;
  else if(mode==="pull-out")scale=1.075-.075*q;
  else if(mode==="pan-left"){offsetX=-width*.045*q;scale=1+.012*q}
  else if(mode==="pan-right"){offsetX=width*.045*q;scale=1+.012*q}
  else if(mode==="crane-up"){offsetY=-height*.030*q;scale=1+.020*q}
  else if(mode==="tilt-down"){offsetY=height*.025*q;scale=1+.015*q}
  else if(mode==="drift"){offsetX=Math.sin(q*Math.PI)*width*.018;offsetY=-height*.010*q;rotation=.22*Math.sin(q*Math.PI)}
  else if(mode==="handheld"){offsetX=Math.sin(q*Math.PI*7)*width*.0035;offsetY=Math.cos(q*Math.PI*5.3)*height*.0025;rotation=.10*Math.sin(q*Math.PI*3.1)}
  const impact=Math.max(0,Math.min(2,Number(scene&&scene.impact_strength)||0));
  if(impact>0){const envelope=Math.exp(-q*5.5);offsetX+=Math.sin(q*52)*width*.004*impact*envelope;offsetY+=Math.cos(q*41)*height*.003*impact*envelope;rotation+=.12*impact*envelope*Math.sin(q*38)}
  return {scale,offsetX,offsetY,rotation,mode,ported};
 }
 function characterPosition(c,progress,width,height){
  const portrait=height>width;
  let x=Number.isFinite(Number(c&&c.x))?Number(c.x):(portrait ? 0.78 : 0.92);
  if(Number(c&&c.walking)===1&&Number.isFinite(Number(c.walk_from_x))&&Number.isFinite(Number(c.walk_to_x))){
   x=Number(c.walk_from_x)+(Number(c.walk_to_x)-Number(c.walk_from_x))*easeSmooth(progress);
  }
  x=Math.max(.05,Math.min(.95,x));
  if(portrait)x=Math.min(x,.82);
  return {x,y:Number.isFinite(Number(c&&c.y))?Math.max(.05,Math.min(.95,Number(c.y))):(portrait ? 0.70 : 0.56)};
 }
 window.cameraTransformForTest=cameraTransformFor;
 window.characterPositionForTest=characterPosition;

 const characterRigVisemeGeometry={closed:[.22,.006],open:[.30,.028],wide:[.48,.018],round:[.24,.028],teeth:[.38,.024],tongue:[.30,.026],sibilant:[.44,.009],lip:[.25,.012],open_wide:[.50,.026],open_round:[.25,.030]};
 function drawCharacter(c,progress,frame){
  if(!c||c.enabled!==true)return;
  const portrait=canvas.height>canvas.width,w=canvas.width,h=canvas.height;
  const scale=Math.min(w,h)*(Number(c.scale)||(portrait?0.36:0.33)),position=characterPosition(c,progress,w,h),cx=w*position.x,cy=h*position.y;
