<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline Agent HQ Canvas Renderer</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0f}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="frame" width="1920" height="1080"></canvas>
<script>
(() => {
 const canvas=document.getElementById("frame"),ctx=canvas.getContext("2d",{alpha:false});
 const p={bg:"#0b0b0f",fg:"#f4f2ec",accent:"#c8ff3d",muted:"#a7a7b3",grid:"#24242c"};
 function wrap(text,maxWidth,font){ctx.font=font;const lines=[];let line="";for(const word of String(text||"").split(/\\s+/)){const c=line?line+" "+word:word;if(ctx.measureText(c).width>maxWidth&&line){lines.push(line);line=word}else line=c}if(line)lines.push(line);return lines}
 window.drawFrame=function(scene,localFrame,sceneFrames,globalFrame){
  const w=canvas.width,h=canvas.height,portrait=h>w,progress=sceneFrames<=1?1:localFrame/(sceneFrames-1),pulse=.5+.5*Math.sin(globalFrame/30*Math.PI*1.2);
  const left=w*.078,contentW=w*.844,grid=Math.max(24,Math.round(w/30)),fontSize=portrait?w*.078:Math.min(88,w*.046),eyebrowY=portrait?h*.31:h*.19,headlineY=portrait?h*.45:h*.46,subY=portrait?h*.59:h*.60,barY=portrait?h*.76:h*.79,footerY=h*.87,barW=contentW*.58;
  ctx.fillStyle=p.bg;ctx.fillRect(0,0,w,h);ctx.strokeStyle=p.grid;ctx.lineWidth=1;
  for(let x=0;x<w;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
  for(let y=0;y<h;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  ctx.fillStyle=p.accent;ctx.fillRect(left,eyebrowY-55,Math.max(30,w*.028),6);
  ctx.font="700 "+Math.max(15,w*.013)+"px Arial";ctx.fillStyle=p.muted;ctx.fillText(String(scene.eyebrow||"OFFLINE AGENT HQ").toUpperCase(),left,eyebrowY);
  const headFont="700 "+fontSize+"px Arial",lines=wrap(scene.headline||"Every frame is code.",contentW,headFont);
  ctx.font=headFont;ctx.fillStyle=p.fg;const lineHeight=fontSize*1.18;
  lines.slice(0,3).forEach((line,i)=>{ctx.globalAlpha=Math.min(1,Math.max(0,progress*5-i*.25));ctx.fillText(line,left,headlineY+i*lineHeight)});
  ctx.globalAlpha=1;
  const subFont="400 "+Math.max(20,w*.023)+"px Arial",sub=wrap(scene.subhead||"",contentW,subFont);
  ctx.font=subFont;ctx.fillStyle=p.muted;sub.slice(0,3).forEach((line,i)=>ctx.fillText(line,left,subY+i*Math.max(27,w*.032)));
  ctx.fillStyle="#30303a";ctx.fillRect(left,barY,barW,3);ctx.fillStyle=p.accent;ctx.fillRect(left,barY,Math.max(0,Math.min(barW,progress*barW)),3);
  ctx.strokeStyle=p.accent;ctx.lineWidth=2;ctx.globalAlpha=.35+pulse*.65;
  const cx=w*.84,cy=portrait?h*.22:h*.26,r=Math.min(w,h)*(portrait?.055:.075);
  ctx.beginPath();ctx.arc(cx,cy,r+pulse*8,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,r*1.42+pulse*8,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  ctx.font="600 "+Math.max(13,w*.0105)+"px monospace";ctx.fillStyle=p.muted;ctx.fillText("FRAME "+String(globalFrame).padStart(6,"0"),left,footerY);
  ctx.textAlign="right";ctx.fillText("LOCAL RENDER / "+String(Math.round(progress*100)).padStart(3," ")+"%",w-left,footerY);ctx.textAlign="left";
  ctx.fillStyle=p.fg;ctx.font="600 "+Math.max(12,w*.0094)+"px monospace";ctx.fillText("OFFLINE AGENT HQ",left,Math.min(h-24,footerY+Math.max(30,w*.035)));
 };
})();
</script></body></html>
