<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline Agent HQ Canvas Renderer</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0f}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="frame" width="1920" height="1080"></canvas>
<script>
(() => {
 const canvas=document.getElementById("frame"),ctx=canvas.getContext("2d",{alpha:false});
 const p={bg:"#0b0b0f",fg:"#f4f2ec",accent:"#c8ff3d",muted:"#a7a7b3",grid:"#24242c"};
 const RTL_SCRIPT=/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/;
 const TEXT_FONT='"Noto Naskh Arabic","Noto Nastaliq Urdu","Nirmala UI",Arial,sans-serif';
 function isRtlText(text){return RTL_SCRIPT.test(String(text||""))}
 function textDirection(text,profile){return isRtlText(text)?"rtl":"ltr"}
 window.textDirectionForTest=function(text){return textDirection(text, "");};
 function wrap(text,maxWidth,font,direction="ltr"){ctx.font=font;const oldDirection=ctx.direction,oldAlign=ctx.textAlign;ctx.direction=direction;ctx.textAlign=direction==="rtl"?"right":"left";const lines=[];let line="";for(const word of String(text||"").split(/\s+/)){const candidate=line?line+" "+word:word;if(ctx.measureText(candidate).width>maxWidth&&line){lines.push(line);line=word}else line=candidate}if(line)lines.push(line);ctx.direction=oldDirection;ctx.textAlign=oldAlign;return lines}
 function getCaptionPage(text,maxWidth,font,progress,direction="ltr"){
  const all=wrap(text,maxWidth,font,direction),perPage=2,pages=Math.max(1,Math.ceil(all.length/perPage));
  const index=Math.min(pages-1,Math.floor(Math.max(0,Math.min(.999999,progress))*pages));
  return {allLines:all,totalPages:pages,pageIndex:index,lines:all.slice(index*perPage,index*perPage+perPage)};
 }
 window.captionPageForTest=function(text,maxWidth,font,progress){return getCaptionPage(text,maxWidth,font,progress);};
 window.measureWrappedLines=function(text,maxWidth,font){return wrap(text,maxWidth,font).length;};
 function drawSceneGraphic(scene,progress,frame){
  const w=canvas.width,h=canvas.height,portrait=h>w,left=w*.078,contentW=w*.844;
  const type=String(scene.visual_type||"hero").toLowerCase();
  const gx=portrait?left:w*.635,gy=portrait?(type==="bar-chart"?h*.63:h*.68):h*.36,gw=portrait?contentW:w*.225,gh=portrait?(type==="bar-chart"?h*.14:h*.08):h*.315;
  const accent=p.accent,fg=p.fg,muted=p.muted,panel="#15151d",line="#454552";
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const rounded=(x,y,ww,hh,r,fill,stroke)=>{ctx.beginPath();ctx.roundRect(x,y,ww,hh,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}};
  const label=(text,x,y,size=18,color=fg,font="600")=>{ctx.font=font+" "+size+"px Arial";ctx.fillStyle=color;ctx.textAlign="center";ctx.fillText(String(text||"").slice(0,42),x,y);ctx.textAlign="left"};
  const nodes=Array.isArray(scene.visual_nodes)?scene.visual_nodes.map(v=>String(v).slice(0,24)).slice(0,4):[];
  const events=Array.isArray(scene.timeline_events)?scene.timeline_events.map(v=>String(v).slice(0,24)).slice(0,4):[];
  ctx.save();
  // A unified eased scale-in makes each information layer enter with intent instead of appearing as a static card.
  const reveal=easeSmooth(clamp(progress/0.24,0,1)),graphicScale=0.94+0.06*reveal;
  ctx.translate(gx+gw*.5,gy+gh*.5);ctx.scale(graphicScale,graphicScale);ctx.translate(-(gx+gw*.5),-(gy+gh*.5));
  if(type==="stat"){
    rounded(gx,gy,gw,gh,14,panel,line);
    ctx.fillStyle=accent;ctx.fillRect(gx+14,gy+14,Math.max(28,gw*.12),4);
    label(scene.stat_value||"3.2×",gx+gw*.5,gy+gh*.56,Math.min(56,gw*.19),accent,"700");
    label(scene.stat_label||"MEASURED IMPACT",gx+gw*.5,gy+gh*.80,Math.max(12,Math.min(18,gw*.055)),muted,"600");
  }else if(type==="diagram"){
    const items=nodes.length?nodes:["INPUT","PROCESS","OUTPUT"],gap=gh*.07,nh=(gh-gap*(items.length-1))/items.length;
    ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.globalAlpha=.75;
    items.forEach((item,i)=>{
      const nodeProgress=easeSmooth(clamp((progress-i*.17)/.28,0,1));
      const y=gy+i*(nh+gap)+(1-nodeProgress)*Math.min(18,nh*.22),barW=gw*.90*nodeProgress,x=gx+(gw-barW)/2;
      ctx.save();ctx.globalAlpha=nodeProgress;
      if(i>0&&nodeProgress>.02){ctx.beginPath();ctx.moveTo(gx+gw*.5,y-gap);ctx.lineTo(gx+gw*.5,y-2);ctx.stroke();ctx.beginPath();ctx.moveTo(gx+gw*.5-5,y-7);ctx.lineTo(gx+gw*.5,y-2);ctx.lineTo(gx+gw*.5+5,y-7);ctx.stroke()}
      rounded(x,y,barW,nh,8,panel,line);
      ctx.fillStyle=accent;ctx.fillRect(x,y,4,nh);
      label(item,gx+gw*.5,y+nh*.58,Math.max(12,Math.min(19,gw*.055)),fg,"600");
      ctx.restore();
    });
    ctx.globalAlpha=1;
  }else if(type==="timeline"){
    rounded(gx,gy,gw,gh,14,panel,line);
    const items=events.length?events:["PLAN","BUILD","REVIEW","SHIP"],y=gy+gh*.43,pad=gw*.10,usable=gw-pad*2;
    ctx.strokeStyle=line;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(gx+pad,y);ctx.lineTo(gx+pad+usable*clamp(progress,0,1),y);ctx.stroke();
    items.forEach((item,i)=>{const x=gx+pad+usable*(items.length===1?0:i/(items.length-1));ctx.beginPath();ctx.arc(x,y,Math.max(5,gw*.018),0,Math.PI*2);ctx.fillStyle=i/(Math.max(1,items.length-1))<=progress?accent:line;ctx.fill();label(item,x,y+gh*.25,Math.max(10,Math.min(16,gw*.043)),muted,"600")});
  }else if(type==="comparison"){
    rounded(gx,gy,gw,gh,14,panel,line);ctx.strokeStyle=line;ctx.beginPath();ctx.moveTo(gx+gw/2,gy+12);ctx.lineTo(gx+gw/2,gy+gh-12);ctx.stroke();
    label(scene.comparison_left_title||"BEFORE",gx+gw*.25,gy+gh*.28,Math.max(12,Math.min(17,gw*.05)),muted);
    label(scene.comparison_right_title||"AFTER",gx+gw*.75,gy+gh*.28,Math.max(12,Math.min(17,gw*.05)),accent);
    const a=Array.isArray(scene.comparison_left)?scene.comparison_left:["Manual","Slow","Scattered"];
    const b=Array.isArray(scene.comparison_right)?scene.comparison_right:["Automated","Faster","Consistent"];
    for(let i=0;i<3;i++){label(a[i]||"",gx+gw*.25,gy+gh*(.48+i*.16),Math.max(10,Math.min(15,gw*.043)),fg,"400");label(b[i]||"",gx+gw*.75,gy+gh*(.48+i*.16),Math.max(10,Math.min(15,gw*.043)),fg,"400")}
  }else if(type==="code"){
    rounded(gx,gy,gw,gh,12,"#0e1115",line);
    ctx.fillStyle="#252831";ctx.fillRect(gx,gy,gw,Math.max(20,gh*.14));
    for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(gx+12+i*12,gy+gh*.07,3,0,Math.PI*2);ctx.fillStyle=[p.accent,"#ff9a72","#77d7ff"][i];ctx.fill()}
    const lines=Array.isArray(scene.code_lines)?scene.code_lines.slice(0,6):["function render(frame) {","  drawScene(frame);","  return output;","}"];
    const fs=Math.max(10,Math.min(14,gw*.032)),start=gy+gh*.27;
    lines.forEach((ln,i)=>{const lineT=easeSmooth(clamp((progress-i*.12)/.24,0,1));ctx.save();ctx.globalAlpha=lineT;ctx.font=fs+"px monospace";ctx.fillStyle=i===0?accent:(i%2?fg:muted);ctx.fillText(String(ln).slice(0,48),gx+12+(1-lineT)*10,start+i*fs*1.45);ctx.restore()});
    if(Math.floor(frame/12)%2===0){ctx.fillStyle=accent;ctx.fillRect(gx+12,Math.min(gy+gh-7,start+lines.length*fs*1.45),8,2)}
  }else if(type==="quote"){
    rounded(gx,gy,gw,gh,14,panel,line);
    ctx.fillStyle=accent;ctx.font="700 "+Math.max(28,Math.min(54,gw*.15))+"px Georgia";ctx.fillText("“",gx+14,gy+gh*.43);
    const quote=String(scene.quote||scene.stat_label||"The clearest idea wins.").slice(0,180);
    const quoteLines=wrap(quote,gw-28,"italic "+Math.max(13,Math.min(19,gw*.05))+"px Arial").slice(0,4);
    ctx.font="italic "+Math.max(13,Math.min(19,gw*.05))+"px Arial";ctx.fillStyle=fg;
    quoteLines.forEach((line,i)=>ctx.fillText(line,gx+14,gy+gh*.57+i*Math.max(16,gh*.09)));
    if(scene.quote_source)label(scene.quote_source,gx+gw*.53,gy+gh*.91,Math.max(10,Math.min(13,gw*.036)),muted,"400");
  }else if(type==="bar-chart"){
    rounded(gx,gy,gw,gh,14,panel,line);
    const values=Array.isArray(scene.chart_values)?scene.chart_values.slice(0,6):[4,7,5,9],labels=Array.isArray(scene.chart_labels)?scene.chart_labels.slice(0,6):["A","B","C","D"],maxValue=Math.max(1,...values.map(v=>Number(v)||0));
    const plotLeft=gx+gw*.08,plotRight=gx+gw*.94,baseY=gy+gh*.78,plotHeight=gh*.52,slot=(plotRight-plotLeft)/Math.max(1,values.length),bw=slot*.52;
    ctx.strokeStyle=line;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(plotLeft,baseY);ctx.lineTo(plotRight,baseY);ctx.stroke();
    values.forEach((value,i)=>{
      const numeric=Math.max(0,Number(value)||0),delay=i*.07,localT=Math.max(0,Math.min(1,(progress-delay)/Math.max(.01,1-delay))),barProgress=localT*localT*(3-2*localT);
      const targetHeight=plotHeight*numeric/maxValue,bh=targetHeight*barProgress,x=plotLeft+i*slot+(slot-bw)/2,y=baseY-bh;
      ctx.fillStyle=i===values.indexOf(maxValue)?accent:"#8c78c8";ctx.globalAlpha=.55+.45*barProgress;ctx.fillRect(x,y,bw,bh);ctx.globalAlpha=1;
      label(String(Math.round(numeric*barProgress)),x+bw/2,Math.max(gy+18,y-7),Math.max(9,Math.min(13,gw*.032)),fg,"600");
      label(labels[i]||"",x+bw/2,baseY+Math.max(13,gh*.07),Math.max(9,Math.min(13,gw*.032)),muted,"400")
    });
  }else if(type==="kinetic-type"){
    rounded(gx,gy,gw,gh,14,panel,line);
    const words=String(scene.headline||"MAKE IT MOVE").split(/\s+/).slice(0,4),gap=gw*.035,cell=(gw-gap*(words.length+1))/Math.max(1,words.length);
    words.forEach((word,i)=>{const t=clamp((progress*words.length-i)*1.5,0,1),x=gx+gap+i*(cell+gap),hh=gh*.60*t,y=gy+gh*.70-hh;ctx.globalAlpha=.35+.65*t;rounded(x,y,cell,hh,7,i%2===0?accent:"#48415f",line);label(word,x+cell*.5,Math.max(gy+18,y+hh*.62),Math.max(9,Math.min(14,cell*.14)),i%2===0? "#0b0b0f":fg,"700");ctx.globalAlpha=1});
  }else if(type==="waveform"){
    rounded(gx,gy,gw,gh,14,panel,line);
    const count=portrait?32:24,barGap=gw/(count*1.7),barWidth=Math.max(2,barGap*.68),mid=gy+gh*.52;
    const envelope=Array.isArray(scene.audio_envelope)?scene.audio_envelope:[];
    for(let i=0;i<count;i++){
      const envelopeIndex=envelope.length?Math.max(0,Math.min(envelope.length-1,Math.round(progress*(envelope.length-1)+(i-(count-1)/2)))):0;
      const energy=envelope.length?clamp(Number(envelope[envelopeIndex])||0,0,1):Math.abs(Math.sin(i*.57+frame*.09));
      const amplitude=envelope.length ? (.08+.42*energy) : (.12+.35*energy)*(0.45+0.55*progress),bh=amplitude*gh,x=gx+gw*.06+i*(barGap*1.5);
      ctx.globalAlpha=.5+.5*(i/count);ctx.fillStyle=i/count<progress?accent:muted;ctx.fillRect(x,mid-bh/2,barWidth,bh)
    }
    ctx.globalAlpha=1;
  }else{
    const cx=gx+gw*.5,cy=gy+gh*.48,r=Math.min(gw,gh)*(.22+.025*Math.sin(frame*.09));
    ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.globalAlpha=.8;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(cx,cy,r*(1+i*.48),0,Math.PI*2);ctx.stroke()}
    ctx.globalAlpha=1;
    label(scene.graphic_label||"CORE IDEA",cx,gy+gh*.92,Math.max(10,Math.min(15,gw*.045)),muted);
  }
  ctx.restore();
 }

 function easeSmooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}
 const characterRigVisemeGeometry={closed:[.22,.006],open:[.30,.028],wide:[.48,.018],round:[.24,.028],teeth:[.38,.024],tongue:[.30,.026],sibilant:[.44,.009],lip:[.25,.012],open_wide:[.50,.026],open_round:[.25,.030]};
 function drawCharacter(c,progress,frame){
  if(!c||c.enabled!==true)return;
  const portrait=canvas.height>canvas.width,w=canvas.width,h=canvas.height;
  const scale=Math.min(w,h)*(Number(c.scale)||(portrait?0.36:0.33)),requestedX=Number(c.x),cx=w*(portrait?Math.min(requestedX||0.78,0.82):(requestedX||0.92)),cy=h*(Number(c.y)||(portrait?0.70:0.56));
  const bob=Math.sin(frame*0.10)*scale*.012,breath=Math.sin(frame*.055)*scale*.009;
  const gesture=easeSmooth((progress-.08)/.18)*(1-easeSmooth((progress-.78)/.14));
  const beatPulse=Math.pow(Math.max(0,Math.sin(progress*Math.PI*4.0)),1.8);
  const idleSway=Math.sin(frame*.052)*.035;
  const secondaryMotion=(Math.sin(frame*.16-0.65)*.012*gesture+beatPulse*.035)*scale;
  const skin=c.skin||"#c58e72",hair=c.hair||"#25212a",shirt=c.shirt||"#6479b8",trousers=c.trousers||"#303746",line=c.outline||"#15151d";
  const expression=String(c.expression||"confident").toLowerCase();
  const pose=String(c.pose||"explain").toLowerCase();
  const bone=(a,b,width,color)=>{
   ctx.lineCap="round";ctx.lineJoin="round";
   ctx.strokeStyle=line;ctx.lineWidth=width+scale*.026;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
   ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  };
  const endpoint=(p,length,angle)=>({x:p.x+Math.cos(angle)*length,y:p.y+Math.sin(angle)*length});
  const joint=(p,r)=>{ctx.fillStyle=skin;ctx.strokeStyle=line;ctx.lineWidth=scale*.012;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.stroke()};
  const shoe=(p,rotation)=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rotation);ctx.fillStyle="#171821";ctx.strokeStyle=line;ctx.lineWidth=scale*.012;ctx.beginPath();ctx.ellipse(0,0,scale*.105,scale*.038,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()};
  ctx.save();ctx.translate(cx,cy+bob);
  // Soft contact shadow grounds the rig and makes foot placement readable on the grid.
  ctx.save();ctx.globalAlpha=.15;ctx.fillStyle="#000000";ctx.beginPath();
  ctx.ellipse(0,scale*.69+0,scale*.255,scale*.042,0,0,Math.PI*2);
  ctx.fill();ctx.restore();
  // Legs are separate upper/lower bones joined at knee pivots; gait is eased and bounded.
  const walk=Number(c.walking)===1?Math.sin(frame*.12)*.28:Math.sin(frame*.045)*.025;
  const hipL={x:-scale*.105,y:scale*.17},hipR={x:scale*.105,y:scale*.17};
  const kneeL=endpoint(hipL,scale*.245,Math.PI/2+walk);
  const kneeR=endpoint(hipR,scale*.245,Math.PI/2-walk);
  const ankleL=endpoint(kneeL,scale*.235,Math.PI/2-walk*.42);
  const ankleR=endpoint(kneeR,scale*.235,Math.PI/2+walk*.42);
  bone(hipL,kneeL,scale*.071,trousers);bone(kneeL,ankleL,scale*.064,trousers);
  bone(hipR,kneeR,scale*.071,trousers);bone(kneeR,ankleR,scale*.064,trousers);
  joint(kneeL,scale*.035);joint(kneeR,scale*.035);shoe({x:ankleL.x-scale*.025,y:ankleL.y+scale*.015},-walk*.2);shoe({x:ankleR.x+scale*.025,y:ankleR.y+scale*.015},walk*.2);
  // Shoulder, elbow and wrist pivots are independent. The gesture is driven by eased scene progress.
  const shoulderL={x:-scale*.205,y:-scale*.185},shoulderR={x:scale*.205,y:-scale*.185};
  const leftUpperAngle=2.05-gesture*.24+idleSway+(pose==="think"?-.18:0)-beatPulse*.10;
  const rightUpperAngle=.98-gesture*.82+(pose==="point"?-.18:0)-beatPulse*.42;
  const elbowL=endpoint(shoulderL,scale*.205,leftUpperAngle);
  const elbowR=endpoint(shoulderR,scale*.205,rightUpperAngle);
  const leftForeAngle=2.05+gesture*.28+beatPulse*.18;
  const rightForeAngle=1.18-gesture*.68+secondaryMotion/Math.max(1,scale)+(pose==="think" ? .38 : 0);
  const wristL=endpoint(elbowL,scale*.185,leftForeAngle);
  const wristR=endpoint(elbowR,scale*.185,rightForeAngle);
  bone(shoulderL,elbowL,scale*.052,shirt);bone(elbowL,wristL,scale*.046,shirt);
  bone(shoulderR,elbowR,scale*.052,shirt);bone(elbowR,wristR,scale*.046,shirt);
  joint(elbowL,scale*.029);joint(elbowR,scale*.029);
  // Torso remains a separate layer and covers upper-arm origins for clean overlap.
  ctx.fillStyle=shirt;ctx.strokeStyle=line;ctx.lineWidth=scale*.018;ctx.beginPath();
  ctx.moveTo(-scale*.21,-scale*.23);ctx.quadraticCurveTo(0,-scale*.31,scale*.21,-scale*.23);
  ctx.lineTo(scale*.19,scale*.20);ctx.quadraticCurveTo(0,scale*.27,-scale*.19,scale*.20);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle="rgba(244,242,236,0.72)";ctx.lineWidth=scale*.012;ctx.beginPath();ctx.moveTo(-scale*.075,-scale*.255);ctx.lineTo(0,-scale*.19);ctx.lineTo(scale*.075,-scale*.255);ctx.stroke();
  ctx.strokeStyle="rgba(21,21,29,0.55)";ctx.lineWidth=scale*.009;ctx.beginPath();ctx.moveTo(0,-scale*.18);ctx.lineTo(0,scale*.19);ctx.stroke();
  ctx.strokeStyle="rgba(244,242,236,0.50)";ctx.lineWidth=scale*.010;ctx.strokeRect(-scale*.135,-scale*.075,scale*.07,scale*.075);
  for(const by of [-scale*.075,scale*.005,scale*.085]){ctx.fillStyle=p.accent;ctx.beginPath();ctx.arc(scale*.025,by,scale*.008,0,Math.PI*2);ctx.fill()}
  // Hands are separate wrist-attached shapes, with a readable palm and three finger strokes.
  for(const [hand,rotation] of [[wristL,-.25],[wristR,.20]]){
   ctx.save();ctx.translate(hand.x,hand.y);ctx.rotate(rotation);
   ctx.fillStyle=skin;ctx.strokeStyle=line;ctx.lineWidth=scale*.012;ctx.beginPath();ctx.ellipse(0,0,scale*.052,scale*.041,0,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.strokeStyle=skin;ctx.lineWidth=scale*.014;
   for(let finger=0;finger<3;finger++){const fx=(finger-1)*scale*.022;ctx.beginPath();ctx.moveTo(fx,scale*.012);ctx.lineTo(fx+(finger-1)*scale*.008,scale*.039);ctx.stroke()}
   ctx.restore();
  }
  ctx.fillStyle=skin;ctx.fillRect(-scale*.055,-scale*.34+breath,scale*.11,scale*.12);
  const headY=-scale*.48+breath+Math.sin(progress*Math.PI*2)*scale*.003,headW=scale*.18,headH=scale*.22;
  const headTilt=Math.sin(frame*.018)*.035+idleSway*.40+(expression==="curious"?-.045:0)+beatPulse*.018;
  ctx.save();ctx.translate(0,headY);ctx.rotate(headTilt);
  ctx.fillStyle=skin;ctx.strokeStyle=line;ctx.lineWidth=scale*.014;ctx.beginPath();ctx.ellipse(0,0,headW,headH,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle=hair;ctx.beginPath();ctx.moveTo(-headW*1.02,-headH*.02);ctx.quadraticCurveTo(-headW*1.1,-headH*1.3,0,-headH*1.12);ctx.quadraticCurveTo(headW*1.12,-headH*1.1,headW,-headH*.2);ctx.lineTo(headW*.55,-headH*.36);ctx.lineTo(headW*.18,-headH*.13);ctx.lineTo(-headW*.25,-headH*.33);ctx.lineTo(-headW*.7,-headH*.16);ctx.closePath();ctx.fill();
  ctx.strokeStyle="rgba(244,242,236,0.24)";ctx.lineWidth=scale*.009;ctx.beginPath();ctx.moveTo(-headW*.62,-headH*.68);ctx.quadraticCurveTo(-headW*.18,-headH*1.02,headW*.43,-headH*.76);ctx.stroke();
  const blink=(frame%173>168&&frame%173<172)?0.15:1,gazeX=Math.sin(frame*.031)*headW*.05,gazeY=Math.sin(frame*.019)*headH*.035;
  const browLift=expression==="curious"?-headH*.07:(expression==="concerned"?headH*.055:(expression==="focused"?headH*.025:0));
  for(const ex of [-1,1]){
   ctx.fillStyle=skin;ctx.strokeStyle=line;ctx.lineWidth=scale*.010;ctx.beginPath();ctx.ellipse(ex*headW*.98,headH*.10,headW*.11,headH*.15,0,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.fillStyle="#f4f2ec";ctx.beginPath();ctx.ellipse(ex*headW*.39,0,headW*.19,headH*.13*blink,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#292b39";ctx.beginPath();ctx.arc(ex*headW*.39+gazeX,gazeY,headW*.07,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle=hair;ctx.lineWidth=scale*.014;ctx.beginPath();ctx.moveTo(ex*headW*.57,-headH*.23+browLift);ctx.quadraticCurveTo(ex*headW*.39,-headH*.34+browLift,ex*headW*.20,-headH*.26+browLift);ctx.stroke();
  }
  ctx.strokeStyle="#8f5f50";ctx.lineWidth=scale*.009;ctx.beginPath();ctx.moveTo(0,headH*.03);ctx.lineTo(scale*.008,headH*.20);ctx.stroke();
  // Ten reusable mouth/viseme groups. Cue timing remains approximate unless a true aligner supplied it.
  const visemeShapes=Object.keys(characterRigVisemeGeometry);
  const vis=(Array.isArray(c.visemes)?c.visemes:[]).filter(v=>Number.isFinite(Number(v.t))&&Number(v.t)>=0&&Number(v.t)<=1&&visemeShapes.includes(String(v.shape))).slice().sort((a,b)=>Number(a.t)-Number(b.t));
  const geometry=characterRigVisemeGeometry;
  let mouthW=.27,mouthH=.018,activeShape="open";
  if(vis.length){
