name: Windows setup smoke test

# Windows validation consumes separate hosted-runner minutes. Keep this check
# available on demand so routine pushes use the consolidated Linux pipeline only.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-setup.yml"
      - "setup_windows.ps1"
      - "setup_all_windows.ps1"
      - "setup_urdu_tts_windows.ps1"
      - "scripts/**"
      - ".vscode/**"
      - "video_studio/**"

permissions:
  contents: read

jobs:
  windows-setup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Parse PowerShell setup and sync scripts
        shell: pwsh
        run: |
          $files = @(
            "./setup_windows.ps1",
            "./setup_all_windows.ps1",
            "./setup_urdu_tts_windows.ps1",
            "./scripts/sync-and-test.ps1",
            "./scripts/install-auto-sync.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { Write-Error ("PowerShell parse failed for " + $file); $errors | Format-List; exit 1 }
          }

      - name: Validate project setup and Python syntax
        shell: pwsh
        run: ./setup_windows.ps1
