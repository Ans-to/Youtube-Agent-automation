name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python modules
        run: python -m py_compile agent.py dashboard.py bridge/bridge.py video_studio/studio.py video_studio/production.py
      - name: Check JavaScript syntax
        run: node --check video_studio/render.js
      - name: Validate storyboard JSON
        run: python -m json.tool video_studio/storyboard.example.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
