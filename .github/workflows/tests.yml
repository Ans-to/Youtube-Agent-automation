name: Project checks

on:
  push:
    branches: [main, 'video-studio/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python modules
        run: python -m py_compile agent.py dashboard.py queue_store.py bridge/bridge.py agents/dispatch.py agents/orchestrate.py agents/practice.py video_studio/studio.py video_studio/production.py video_studio/research.py video_studio/validate_render.py video_studio/validate_frames.py video_studio/quality_audit.py video_studio/release_gate.py video_studio/publish_youtube.py product_studio/build_product.py
      - name: Check JavaScript syntax
        run: node --check video_studio/render.js
      - name: Validate storyboard JSON
        run: python -m json.tool video_studio/storyboard.example.json
      - name: Validate specialist roster and skillbooks JSON
        run: |
          python -m json.tool agents/roster.json > /dev/null
          python -m json.tool agents/skillbooks.json > /dev/null
      - name: Build offline product prototype in template mode
        run: python product_studio/build_product.py --title "CI Utility" --idea "A local utility smoke test"
      - name: Generate video script and storyboard in template mode
        run: python video_studio/production.py --topic "CI video package smoke test" --out workspace/ci-video-package
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run complete unit-test suite inside a clean Python container
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace python:3.12-slim python -m unittest discover -s tests -v

  render-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install renderer dependencies
        working-directory: video_studio
        run: npm install
      - name: Audit renderer dependencies
        working-directory: video_studio
        run: npm audit --audit-level=high
      - name: Reject invalid transition before browser launch
        working-directory: video_studio
        run: |
          set +e
          node render.js storyboard.invalid-transition.json > invalid-transition.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "Invalid transition was unexpectedly accepted"; exit 1; fi
          grep -q "Unsupported transition_in" invalid-transition.log
      - name: Reject oversized storyboard before allocating frames
        working-directory: video_studio
        run: |
          set +e
          node render.js storyboard.over-limit.json > limit-check.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "Oversized storyboard was unexpectedly accepted"; exit 1; fi
          grep -q "30000-frame render limit" limit-check.log
      - name: Render and validate a 1-second landscape MP4
        run: python video_studio/studio.py --storyboard storyboard.smoke.json --output outputs/ci-smoke.mp4
        working-directory: .
      - name: Render and validate a 1-second vertical Shorts MP4
        run: python video_studio/studio.py --storyboard storyboard.smoke-shorts.json --output outputs/ci-smoke-shorts.mp4
        working-directory: .

  demo-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install renderer dependencies
        working-directory: video_studio
        run: npm install
      - name: Install local Urdu TTS engine
        run: python -m pip install --upgrade pip piper-tts
      - name: Download licensed Urdu male voice model
        run: |
          mkdir -p video_studio/voices/ur_PK-fasih-medium
          curl --fail --location --retry 3 --output video_studio/voices/ur_PK-fasih-medium/ur_PK-fasih-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/ur/ur_PK/fasih/medium/ur_PK-fasih-medium.onnx
          curl --fail --location --retry 3 --output video_studio/voices/ur_PK-fasih-medium/ur_PK-fasih-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/ur/ur_PK/fasih/medium/ur_PK-fasih-medium.onnx.json
          test "$(stat -c%s video_studio/voices/ur_PK-fasih-medium/ur_PK-fasih-medium.onnx)" -gt 1000000
      - name: Render motion-character prototype with Urdu voice
        run: |
          export PIPER_MODEL="$GITHUB_WORKSPACE/video_studio/voices/ur_PK-fasih-medium/ur_PK-fasih-medium.onnx"
          python video_studio/studio.py --storyboard video_studio/storyboard.motion-character-demo.json --output outputs/motion-character-transition-demo.mp4 --with-voice
      - name: Validate rendered MP4 and audible narration
        run: |
          python video_studio/validate_render.py video_studio/outputs/motion-character-transition-demo.mp4 --width 1280 --height 720 --fps 30 --require-audio
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json video_studio/outputs/motion-character-transition-demo.mp4
          test -s video_studio/outputs/motion-character-transition-demo.mp4
          python video_studio/quality_audit.py video_studio/outputs/motion-character-transition-demo.mp4 --report video_studio/outputs/motion-character-transition-demo.qc.json
      - name: Upload rendered prototype
        uses: actions/upload-artifact@v4
        with:
          name: motion-character-transition-prototype
          path: |
            video_studio/outputs/motion-character-transition-demo.mp4
            video_studio/outputs/motion-character-transition-demo.qc.json
          if-no-files-found: error
          retention-days: 7
