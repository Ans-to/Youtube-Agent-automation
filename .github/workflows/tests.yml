name: Project checks

on:
  push:
    branches: [main, integration/agent-hq-complete-20261020]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    # One Linux runner runs all checks sequentially. This preserves coverage while
    # reducing runner startups and Actions usage.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Enforce immutable GitHub Action references
        shell: bash
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          failures = []
          for workflow in sorted(Path(".github/workflows").glob("*.y*ml")):
              for line_number, line in enumerate(workflow.read_text(encoding="utf-8").splitlines(), 1):
                  match = re.match(r"^\s*uses:\s*([^\s#]+)(?:\s+#.*)?$", line)
                  if not match:
                      continue
                  reference = match.group(1).rsplit("@", 1)
                  if len(reference) != 2 or not re.fullmatch(r"[0-9a-f]{40}", reference[1]):
                      failures.append(f"{workflow}:{line_number}: action must be pinned to a full 40-character commit SHA")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("PASS: every external GitHub Action is pinned to a full commit SHA")
          PY
      - name: Enforce North Star invariants
        run: python tools/check_invariants.py

      - name: Enforce code structure (layers, state, duplication, naming)
        run: python tools/check_structure.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Compile Python modules (Python 3.11)
        run: python -m py_compile app_config.py agent.py dashboard.py queue_store.py app/__init__.py app/errors.py app/paths.py app/state.py app/services/tasks.py app/services/workflows.py app/services/status.py app/services/requests.py app/infrastructure/local_model.py app/infrastructure/ffmpeg.py app/infrastructure/jsonio.py ui/__init__.py ui/dashboard/__init__.py ui/dashboard/server.py ui/dashboard/views.py ui/dashboard/security.py bridge/bridge.py agents/dispatch.py agents/adhd_style.py agents/orchestrate.py agents/routing.py agents/practice.py video_studio/studio.py video_studio/capabilities.py video_studio/render_lock.py video_studio/production.py video_studio/production_readiness.py video_studio/voice_backends.py video_studio/piper_urdu_tts_adapter.py video_studio/urdu_tts_adapter.py video_studio/voice_preview.py video_studio/captions.py video_studio/research.py video_studio/validate_render.py video_studio/validate_frames.py video_studio/quality_audit.py video_studio/repeat_frames.py video_studio/release_gate.py tools/check_structure.py tools/process_env.py video_studio/publish_youtube.py video_studio/audit_video.py product_studio/build_product.py tools/check_repeat_frames.py tools/run_quality_gate.py tools/check_invariants.py tools/tool_runtime.py tools/tool_agent.py tools/data_analysis.py tools/test_fix.py tools/memory.py tools/review.py tools/resources.py tools/make_icons.py tools/long_form.py

      - name: Check JavaScript syntax
        run: node --check video_studio/render.js

      - name: Validate storyboard JSON
        run: python -m json.tool video_studio/storyboard.example.json

      - name: Validate specialist roster and skillbooks JSON
        run: |
          python -m json.tool agents/roster.json > /dev/null
          python -m json.tool agents/skillbooks.json > /dev/null

      - name: Build offline product prototype in template mode
        run: python product_studio/build_product.py --title "CI Utility" --idea "A local utility smoke test"

      - name: Run unit tests (Python 3.11)
        run: python -m unittest discover -s tests -v

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile Python modules (Python 3.12)
        run: python -m py_compile app_config.py agent.py dashboard.py queue_store.py app/__init__.py app/errors.py app/paths.py app/state.py app/services/tasks.py app/services/workflows.py app/services/status.py app/services/requests.py app/infrastructure/local_model.py app/infrastructure/ffmpeg.py app/infrastructure/jsonio.py ui/__init__.py ui/dashboard/__init__.py ui/dashboard/server.py ui/dashboard/views.py ui/dashboard/security.py bridge/bridge.py agents/dispatch.py agents/adhd_style.py agents/orchestrate.py agents/routing.py agents/practice.py video_studio/studio.py video_studio/capabilities.py video_studio/render_lock.py video_studio/production.py video_studio/voice_backends.py video_studio/piper_urdu_tts_adapter.py video_studio/urdu_tts_adapter.py video_studio/voice_preview.py video_studio/captions.py video_studio/research.py video_studio/validate_render.py video_studio/validate_frames.py video_studio/quality_audit.py video_studio/repeat_frames.py video_studio/release_gate.py tools/check_structure.py tools/process_env.py video_studio/publish_youtube.py video_studio/audit_video.py product_studio/build_product.py tools/check_repeat_frames.py tools/run_quality_gate.py tools/check_invariants.py tools/tool_runtime.py tools/tool_agent.py tools/data_analysis.py tools/test_fix.py tools/memory.py tools/review.py tools/resources.py tools/make_icons.py tools/long_form.py

      - name: Run unit tests (Python 3.12)
        run: python -m unittest discover -s tests -v

      - name: Run complete unit-test suite inside a clean Python container
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace python:3.12-slim python -m unittest discover -s tests -v

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install renderer dependencies
        working-directory: video_studio
        run: npm ci

      - name: Audit renderer dependencies
        # A registry outage must not be reported as a vulnerability, and a real
        # finding must not be retried away. The wrapper retries only transport
        # failures and fails the step on any high/critical advisory.
        run: python tools/audit_npm_dependencies.py --directory video_studio --minimum high

      - name: Audit shipped Python requirements
        # The requirements files the default setup actually installs. The optional
        # Kani/NeMo backend is excluded because NeMo pins transitive versions that
        # have no fixed release; that trade-off is documented in the file itself.
        run: |
          python -m pip install --quiet --disable-pip-version-check pip-audit
          pip-audit -r video_studio/requirements-urdu-tts.txt --no-deps
          pip-audit -r video_studio/requirements-publish.txt --no-deps

      - name: Reject invalid transition before browser launch
        working-directory: video_studio
        run: |
          set +e
          node render.js storyboard.invalid-transition.json > invalid-transition.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "Invalid transition was unexpectedly accepted"; exit 1; fi
          grep -q "Unsupported transition_in" invalid-transition.log

      - name: Reject oversized storyboard before allocating frames
        working-directory: video_studio
        run: |
          set +e
          node render.js storyboard.over-limit.json > limit-check.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "Oversized storyboard was unexpectedly accepted"; exit 1; fi
          grep -q "30000-frame render limit" limit-check.log

      - name: Plan a 20-minute film without rendering it
        # The plan is the promise: 36,000 frames must become a bounded number of
        # slices, each inside the renderer's own per-call ceiling.
        run: |
          python - <<'PY'
          import json, pathlib
          storyboard = {"title": "plan only", "width": 1920, "height": 1080, "fps": 30,
                        "scenes": [{"duration_seconds": 12} for _ in range(100)]}
          pathlib.Path("/tmp/ci-plan.json").write_text(json.dumps(storyboard))
          PY
          python tools/long_form.py --storyboard /tmp/ci-plan.json --output /tmp/unused.mp4 --plan-only > /tmp/plan.json
          python - <<'PY'
          import json
          plan = json.loads(open("/tmp/plan.json").read())
          assert plan["duration_seconds"] == 1200.0, plan
          assert plan["total_frames"] == 36000, plan
          assert plan["segments"] == 20, plan
          assert plan["largest_slice_frames"] <= 30000, plan
          print("20-minute plan ok:", plan)
          PY

      - name: Render a film in slices with a real browser and real FFmpeg
        # Proves the range render, the per-slice frame check, the encode and the
        # concat actually work together, not just that the arguments parse.
        working-directory: video_studio
        run: |
          python - <<'PY'
          import json, pathlib
          storyboard = {"title": "CI slice render", "width": 320, "height": 180, "fps": 10,
                        "scenes": [{"duration_seconds": 1, "headline": "slice %d" % (i + 1)}
                                   for i in range(6)]}
          pathlib.Path("/tmp/ci-slice.json").write_text(json.dumps(storyboard))
          PY
          python ../tools/long_form.py --storyboard /tmp/ci-slice.json --output /tmp/ci-slice.mp4 --segment-seconds 1
          python - <<'PY'
          import json, subprocess
          probe = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration",
                                  "-of", "json", "/tmp/ci-slice.mp4"], capture_output=True, text=True, check=True)
          duration = float(json.loads(probe.stdout)["format"]["duration"])
          assert 5.4 <= duration <= 6.6, "concatenated film is " + str(duration) + "s, expected ~6s"
          record = json.loads(open("/tmp/ci-slice.long-form/long-form.json").read())
          assert record["plan"]["segments"] == 6, record["plan"]
          assert record["complete"] is True, record
          print("slice render ok:", duration, "s from", record["plan"]["segments"], "slices")
          PY

      - name: Install pinned local English text-to-speech engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r video_studio/requirements-urdu-tts.txt

      - name: Download pinned English voice model for the end-to-end render
        env:
          PIPER_VOICE_REVISION: b145f2ac26522d6a2ccde0164b7b0e48b1e3199c
        run: |
          set -eu
          voice_dir=video_studio/voices/en_US-lessac-medium
          mkdir -p "$voice_dir"
          curl --fail --location --retry 3 --output "$voice_dir/en_US-lessac-medium.onnx" "https://huggingface.co/rhasspy/piper-voices/resolve/$PIPER_VOICE_REVISION/en/en_US/lessac/medium/en_US-lessac-medium.onnx"
          curl --fail --location --retry 3 --output "$voice_dir/en_US-lessac-medium.onnx.json" "https://huggingface.co/rhasspy/piper-voices/resolve/$PIPER_VOICE_REVISION/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json"
          test -s "$voice_dir/en_US-lessac-medium.onnx"
          test -s "$voice_dir/en_US-lessac-medium.onnx.json"

      - name: End-to-end CEO task to rendered MP4 (offline deterministic mode)
        env:
          PIPER_MODEL: ${{ github.workspace }}/video_studio/voices/en_US-lessac-medium/en_US-lessac-medium.onnx
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import agent
          import dispatch

          root = Path.cwd()
          workspace = root / "workspace"
          workspace.mkdir(parents=True, exist_ok=True)
          (workspace / "ci-source-notes.md").write_text(
              "# Synthetic CI source notes\n\n"
              "This is synthetic test material. It verifies orchestration and rendering only; "
              "it is not factual research or publication content.\n",
              encoding="utf-8",
          )
          (workspace / "ci-config.json").write_text(
              json.dumps({"model": {"enabled": False}, "runner": {"max_tasks_per_cycle": 1}}),
              encoding="utf-8",
          )
          queue = workspace / "ci-task-queue.json"
          queue.write_text(json.dumps([{
              "id": "CI-VIDEO-E2E",
              "kind": "youtube_package",
              "title": "CI template demo render smoke test",
              "input": (
                  "Narration language: English. Create a template demo render MP4 for a faceless YouTube video about "
                  "CI pipeline smoke testing. Generate the video package and render it; "
                  "this is synthetic smoke-test content, not publication content."
              ),
              "context_file": "workspace/ci-source-notes.md",
              "status": "pending",
          }], indent=2), encoding="utf-8")

          # Isolate smoke-test state from the normal queue/config and make network research
          # explicitly unavailable, so the test is deterministic and needs no API keys.
          agent.TASKS = queue
          agent.CONFIG = workspace / "ci-config.json"
          agent.OUTPUTS = workspace / "ci-outputs"
          dispatch.collect_web_research = None
          processed = agent.cycle("CI-VIDEO-E2E")
          if processed != 1:
              raise SystemExit("CEO queue runner did not process the synthetic video task")
          print("PASS: CEO queue runner processed the synthetic task")
          PY
          # Preserve the actual specialist/render failure before the later artifact
          # assertion fails; otherwise the task manifest only contains a truncated summary.
          if [ -f workspace/orchestration/task-CI-VIDEO-E2E/video-studio-tool.log ]; then
            echo "::group::Detailed video-studio tool log"
            cat workspace/orchestration/task-CI-VIDEO-E2E/video-studio-tool.log
            echo "::endgroup::"
          fi

      - name: Verify CEO orchestration and rendered video artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          workspace = root / "workspace"
          task_output = workspace / "ci-outputs" / "CI-VIDEO-E2E.md"
          if not task_output.is_file() or task_output.stat().st_size == 0:
              raise SystemExit("CEO task result was not written")
          destination = workspace / "orchestration" / "task-CI-VIDEO-E2E"
          manifest_path = destination / "pipeline-status.json"
          if not manifest_path.is_file():
              raise SystemExit("CEO pipeline manifest is missing")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          tool = next((item for item in manifest.get("tool_runs", [])
                       if item.get("tool") == "video_studio"), None)
          if not tool or tool.get("status") != "completed":
              raise SystemExit("CEO pipeline did not successfully run the video builder: " + repr(tool))
          checks = manifest.get("artifact_checks", [])
          video_check = next((check for check in checks if check.get("tool") == "video_studio"), None)
          if not video_check or video_check.get("status") != "passed":
              raise SystemExit("Post-build artifact verification did not pass: " + repr(video_check))
          package = workspace / "orchestration" / "task-CI-VIDEO-E2E" / "video-production"
          required = ["script.md", "storyboard.json", "package-status.json", "video.mp4", "video.srt", "video.vtt", "video.qc.json"]
          missing = [name for name in required if not (package / name).is_file()]
          if missing:
              raise SystemExit("Missing video package artifacts: " + ", ".join(missing))
          video = package / "video.mp4"
          if video.stat().st_size <= 0:
              raise SystemExit("End-to-end MP4 is empty")
          status = json.loads((package / "package-status.json").read_text(encoding="utf-8"))
          storyboard = json.loads((package / "storyboard.json").read_text(encoding="utf-8"))
          if status.get("generated_by") != "deterministic_template":
              raise SystemExit("CI must exercise explicit no-model template mode")
          if status.get("publishable") is not False or status.get("published") is not False:
              raise SystemExit("Smoke test package must never be marked publishable or published")
          if (storyboard.get("width"), storyboard.get("height")) != (1920, 1080):
              raise SystemExit("End-to-end landscape storyboard has unexpected dimensions")
          if len(storyboard.get("scenes", [])) != 6:
              raise SystemExit("End-to-end template storyboard should contain six scenes")
          if manifest.get("external_actions_performed") is not False:
              raise SystemExit("Synthetic end-to-end test must not report external actions")
          # CI is intentionally running without an AI model. Treat that as a
          # successful deterministic render smoke test, not as a completed,
          # semantically reviewed production task.
          if manifest.get("status") != "partial":
              raise SystemExit("Template-only pipeline must remain partial, not claim completion: " + repr(manifest.get("status")))
          if manifest.get("quality_gate") != "unconfirmed":
              raise SystemExit("Template-only pipeline must not claim a semantic quality verdict: " + repr(manifest.get("quality_gate")))
          if manifest.get("research_pages_independently_verified") is not False:
              raise SystemExit("Pipeline must not claim independent source verification in this synthetic test")
          print("PASS: CEO queue -> delegation -> builder -> verified MP4 artifacts")
          print("Honest status: partial; semantic quality gate unconfirmed; template-only; not publishable.")
          PY

      - name: Render narrated 30 fps landscape MP4 with character cues
        env:
          PIPER_MODEL: ${{ github.workspace }}/video_studio/voices/en_US-lessac-medium/en_US-lessac-medium.onnx
        run: python video_studio/studio.py --storyboard storyboard.smoke.json --output outputs/ci-smoke.mp4 --language en --with-voice

      - name: Render narrated 30 fps vertical Shorts MP4 with character cues
        env:
          PIPER_MODEL: ${{ github.workspace }}/video_studio/voices/en_US-lessac-medium/en_US-lessac-medium.onnx
        run: python video_studio/studio.py --storyboard storyboard.smoke-shorts.json --output outputs/ci-smoke-shorts.mp4 --language en --with-voice

      - name: Verify narrated character cues and smoke outputs exist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("video_studio/outputs")
          alignment = "audio-energy-gated grapheme approximation; not forced phoneme alignment"
          for name in ("ci-smoke.storyboard.json", "ci-smoke-shorts.storyboard.json"):
              path = root / name
              if not path.is_file():
                  raise SystemExit("Generated voice-aligned storyboard is missing: " + str(path))
              data = json.loads(path.read_text(encoding="utf-8"))
              characters = [
                  scene["character"] for scene in data.get("scenes", [])
                  if isinstance(scene, dict)
                  and isinstance(scene.get("character"), dict)
                  and scene["character"].get("enabled") is True
              ]
              if len(characters) < 3:
                  raise SystemExit(name + " did not retain the three expected enabled character scenes")
              for index, character in enumerate(characters, 1):
                  cues = character.get("visemes")
                  if not isinstance(cues, list) or len(cues) < 3:
                      raise SystemExit(name + " character " + str(index) + " has no useful audio-driven cue sequence")
                  if character.get("viseme_alignment") != alignment:
                      raise SystemExit(name + " character " + str(index) + " has missing or misleading alignment metadata")
              print("PASS:", name, "contains", len(characters), "audio-energy-gated character scenes")
          for name in ("ci-smoke.mp4", "ci-smoke-shorts.mp4"):
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit("Smoke MP4 missing or empty: " + str(path))
          PY

      - name: Verify landscape and Shorts smoke outputs exist for artifact retention
        # Use the default success() condition: cancellation or an earlier render failure
        # must not turn missing outputs into a misleading secondary failure.
        run: |
          test -s video_studio/outputs/ci-smoke.mp4 || { echo "Landscape smoke MP4 missing; artifact paths or render output changed."; exit 1; }
          test -s video_studio/outputs/ci-smoke-shorts.mp4 || { echo "Vertical Shorts smoke MP4 missing; artifact paths or render output changed."; exit 1; }

      # Keep generated smoke-test outputs available for human inspection.
      # The test content is synthetic and must never be used for publication.
      - name: Upload rendered QA artifacts for inspection
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-hq-qa-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            workspace/ci-outputs/CI-VIDEO-E2E.md
            workspace/orchestration/task-CI-VIDEO-E2E/pipeline-status.json
            workspace/orchestration/task-CI-VIDEO-E2E/video-studio-tool.log
            workspace/orchestration/task-CI-VIDEO-E2E/video-production/script.md
            workspace/orchestration/task-CI-VIDEO-E2E/video-production/storyboard.json
            workspace/orchestration/task-CI-VIDEO-E2E/video-production/package-status.json
            workspace/orchestration/task-CI-VIDEO-E2E/video-production/video.mp4
            workspace/orchestration/task-CI-VIDEO-E2E/video-production/video.srt
            workspace/orchestration/task-CI-VIDEO-E2E/video-production/video.vtt
            workspace/orchestration/task-CI-VIDEO-E2E/video-production/video.qc.json
            video_studio/outputs/ci-smoke.mp4
            video_studio/outputs/ci-smoke.srt
            video_studio/outputs/ci-smoke.vtt
            video_studio/outputs/ci-smoke.storyboard.json
            video_studio/outputs/ci-smoke-shorts.mp4
            video_studio/outputs/ci-smoke-shorts.srt
            video_studio/outputs/ci-smoke-shorts.vtt
            video_studio/outputs/ci-smoke-shorts.storyboard.json
          # Explicit smoke-output verification fails successful runs; keep artifact upload best-effort after earlier failures.
          if-no-files-found: warn
          retention-days: 7

  windows-safe-sync:
    name: Windows PowerShell safe-sync validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Parse Windows PowerShell scripts without scheduling tasks
        shell: pwsh
        run: |
          $files = @("scripts/sync-and-test.ps1", "scripts/install-auto-sync.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parsing failed for $file"
            }
            Write-Host "PASS: $file"
          }

      - name: Run local sync-and-test checks without changing Git history
        shell: pwsh
        run: ./scripts/sync-and-test.ps1 -SkipSync -RunTestsOnNoUpdate
