name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python modules
        run: python -m py_compile agent.py dashboard.py bridge/bridge.py video_studio/studio.py video_studio/production.py video_studio/validate_render.py video_studio/release_gate.py video_studio/publish_youtube.py
      - name: Check JavaScript syntax
        run: node --check video_studio/render.js
      - name: Validate storyboard JSON
        run: python -m json.tool video_studio/storyboard.example.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
  render-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install renderer dependencies
        working-directory: video_studio
        run: npm install
      - name: Render and validate a 1-second MP4
        run: python video_studio/studio.py --storyboard storyboard.smoke.json --output outputs/ci-smoke.mp4
        working-directory: .
