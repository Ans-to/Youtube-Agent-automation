name: Human review video previews

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic label for the deterministic visual preview
        required: true
        default: "Every frame is code — faceless video studio preview"
        type: string
  push:
    branches: [main]
    paths:
      - "video_studio/production.py"
      - "video_studio/render.js"
      - "video_studio/render.html"
      - "video_studio/studio.py"
      - "video_studio/quality_audit.py"
      - ".github/workflows/human-review-video.yml"

permissions:
  contents: read

concurrency:
  group: human-review-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-review-videos:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install renderer and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r video_studio/requirements-urdu-tts.txt
          cd video_studio
          npm install

      - name: Download pinned English preview voice
        env:
          PIPER_VOICE_REVISION: b145f2ac26522d6a2ccde0164b7b0e48b1e3199c
        run: |
          set -eu
          voice_dir=video_studio/voices/en_US-lessac-medium
          mkdir -p "$voice_dir"
          curl --fail --location --retry 3 --output "$voice_dir/en_US-lessac-medium.onnx" "https://huggingface.co/rhasspy/piper-voices/resolve/$PIPER_VOICE_REVISION/en/en_US/lessac/medium/en_US-lessac-medium.onnx"
          curl --fail --location --retry 3 --output "$voice_dir/en_US-lessac-medium.onnx.json" "https://huggingface.co/rhasspy/piper-voices/resolve/$PIPER_VOICE_REVISION/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json"
          test -s "$voice_dir/en_US-lessac-medium.onnx"
          test -s "$voice_dir/en_US-lessac-medium.onnx.json"

      - name: Render landscape visual review video
        env:
          PIPER_MODEL: ${{ github.workspace }}/video_studio/voices/en_US-lessac-medium/en_US-lessac-medium.onnx
          TOPIC: ${{ inputs.topic || 'Every frame is code — faceless video studio preview' }}
        run: |
          python video_studio/production.py --topic "$TOPIC" --out workspace/human-review/landscape --format long --language en --render-template

      - name: Render vertical Shorts visual review video
        env:
          PIPER_MODEL: ${{ github.workspace }}/video_studio/voices/en_US-lessac-medium/en_US-lessac-medium.onnx
          TOPIC: ${{ inputs.topic || 'Every frame is code — faceless video studio preview' }}
        run: |
          python video_studio/production.py --topic "$TOPIC" --out workspace/human-review/shorts --format shorts --language en --render-template

      - name: Verify review package completeness and video streams
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path("workspace/human-review")
          for name in ("landscape", "shorts"):
              folder = root / name
              required = ("video.mp4", "video.srt", "video.vtt", "video.qc.json",
                          "script.md", "storyboard.json", "package-status.json")
              missing = [item for item in required if not (folder / item).is_file() or (folder / item).stat().st_size == 0]
              if missing:
                  raise SystemExit(f"{name}: missing or empty review artifacts: {missing}")
              status = json.loads((folder / "package-status.json").read_text(encoding="utf-8"))
              qc = json.loads((folder / "video.qc.json").read_text(encoding="utf-8"))
              if status.get("publishable") is not False or status.get("published") is not False:
                  raise SystemExit(f"{name}: review preview must never be marked publishable or published")
              if not qc.get("passed") or not qc.get("strict"):
                  raise SystemExit(f"{name}: strict technical QA did not pass")
              if status.get("technical_qa_passed") is not True:
                  raise SystemExit(f"{name}: package must explicitly report technical QA status")
              if status.get("quality_audit_scope") != "technical_only_not_artistic_or_editorial":
                  raise SystemExit(f"{name}: technical QA must not be represented as artistic/editorial quality")
              readiness = status.get("production_readiness")
              if not isinstance(readiness, dict) or readiness.get("passed") is not False:
                  raise SystemExit(f"{name}: template preview must be explicitly blocked from production readiness")
              if status.get("production_readiness_passed") is not False:
                  raise SystemExit(f"{name}: template preview must not be marked production-ready")
              probe = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,width,height",
                   "-show_entries", "format=duration", "-of", "json", str(folder / "video.mp4")],
                  check=True, capture_output=True, text=True,
              )
              info = json.loads(probe.stdout)
              streams = info.get("streams", [])
              if not any(s.get("codec_type") == "video" for s in streams):
                  raise SystemExit(f"{name}: MP4 has no video stream")
              if not any(s.get("codec_type") == "audio" for s in streams):
                  raise SystemExit(f"{name}: MP4 has no audio stream")
              video = next(s for s in streams if s.get("codec_type") == "video")
              expected = (1080, 1920) if name == "shorts" else (1920, 1080)
              actual = (video.get("width"), video.get("height"))
              if actual != expected:
                  raise SystemExit(f"{name}: expected dimensions {expected}, got {actual}")
              print(f"PASS {name}: {actual[0]}x{actual[1]}, technical QA passed, production readiness correctly blocked, audio present, human review required")
          PY

      - name: Upload videos and review evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: human-review-video-previews
          path: workspace/human-review/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve draft videos and QC reports when review gate fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: human-review-video-diagnostics
          path: |
            workspace/human-review/
          if-no-files-found: warn
          retention-days: 7
