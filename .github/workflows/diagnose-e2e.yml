name: Diagnose e2e (temporary)

# Temporary: reproduces the "Verify CEO orchestration and rendered video
# artifacts" step and reports each assertion's outcome as an annotation,
# because the raw log archive is not reachable from the development sandbox.
# Deleted once the underlying failure is understood.

on:
  push:
    branches: [arena/118abf10-youtube-agent-automation]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r video_studio/requirements-urdu-tts.txt
          cd video_studio
          npm ci

      - name: Download pinned English voice model
        env:
          PIPER_VOICE_REVISION: b145f2ac26522d6a2ccde0164b7b0e48b1e3199c
        run: |
          set -eu
          voice_dir=video_studio/voices/en_US-lessac-medium
          mkdir -p "$voice_dir"
          curl --fail --location --retry 3 --output "$voice_dir/en_US-lessac-medium.onnx" "https://huggingface.co/rhasspy/piper-voices/resolve/$PIPER_VOICE_REVISION/en/en_US/lessac/medium/en_US-lessac-medium.onnx"
          curl --fail --location --retry 3 --output "$voice_dir/en_US-lessac-medium.onnx.json" "https://huggingface.co/rhasspy/piper-voices/resolve/$PIPER_VOICE_REVISION/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json"

      - name: Run the end-to-end step
        env:
          PIPER_MODEL: ${{ github.workspace }}/video_studio/voices/en_US-lessac-medium/en_US-lessac-medium.onnx
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import agent
          import dispatch

          root = Path.cwd()
          workspace = root / "workspace"
          workspace.mkdir(parents=True, exist_ok=True)
          (workspace / "ci-source-notes.md").write_text(
              "# Synthetic CI source notes\n\nThis is synthetic test material.\n", encoding="utf-8")
          (workspace / "ci-config.json").write_text(
              json.dumps({"model": {"enabled": False}, "runner": {"max_tasks_per_cycle": 1}}), encoding="utf-8")
          queue = workspace / "ci-task-queue.json"
          queue.write_text(json.dumps([{
              "id": "CI-VIDEO-E2E",
              "kind": "youtube_package",
              "title": "CI template demo render smoke test",
              "input": ("Narration language: English. Create a template demo render MP4 for a faceless YouTube video about "
                        "CI pipeline smoke testing. Generate the video package and render it; "
                        "this is synthetic smoke-test content, not publication content."),
              "context_file": "workspace/ci-source-notes.md",
              "status": "pending",
          }], indent=2), encoding="utf-8")
          agent.TASKS = queue
          agent.CONFIG = workspace / "ci-config.json"
          agent.OUTPUTS = workspace / "ci-outputs"
          dispatch.collect_web_research = None
          print("processed:", agent.cycle("CI-VIDEO-E2E"))
          PY

      - name: Report each assertion
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("workspace/orchestration/task-CI-VIDEO-E2E")
          package = base / "video-production"
          failures = []

          def check(name, ok, detail=""):
              print("::notice title=%s::%s" % (
                  ("PASS " if ok else "FAIL ") + name, " ".join(str(detail).split())[:700]))
              if not ok:
                  failures.append(name)

          task_output = Path("workspace/ci-outputs/CI-VIDEO-E2E.md")
          check("task output", task_output.is_file() and task_output.stat().st_size > 0,
                task_output.stat().st_size if task_output.is_file() else "missing")

          manifest_path = base / "pipeline-status.json"
          check("manifest", manifest_path.is_file(), manifest_path)
          if manifest_path.is_file():
              m = json.loads(manifest_path.read_text(encoding="utf-8"))
              tool = next((i for i in m.get("tool_runs", []) if i.get("tool") == "video_studio"), None)
              check("tool completed", bool(tool) and tool.get("status") == "completed",
                    json.dumps(tool.get("summary", ""))[-700:] if tool else "no tool run")
              checks = m.get("artifact_checks", [])
              vc = next((c for c in checks if c.get("tool") == "video_studio"), None)
              check("artifact check passed", bool(vc) and vc.get("status") == "passed",
                    json.dumps(vc)[:900] if vc else "no artifact check")
              check("manifest status partial", m.get("status") == "partial", m.get("status"))
              check("quality gate unconfirmed", m.get("quality_gate") == "unconfirmed", m.get("quality_gate"))
              check("external actions false", m.get("external_actions_performed") is False,
                    m.get("external_actions_performed"))
              check("research unverified", m.get("research_pages_independently_verified") is False,
                    m.get("research_pages_independently_verified"))

          required = ["script.md", "storyboard.json", "package-status.json", "video.mp4", "video.srt", "video.vtt", "video.qc.json"]
          missing = [n for n in required if not (package / n).is_file()]
          check("package complete", not missing, missing)

          if (package / "package-status.json").is_file():
              status = json.loads((package / "package-status.json").read_text(encoding="utf-8"))
              check("generated_by template", status.get("generated_by") == "deterministic_template",
                    status.get("generated_by"))
              check("not publishable", status.get("publishable") is False and status.get("published") is False,
                    [status.get("publishable"), status.get("published")])
              check("technical qa", status.get("technical_qa_passed") is True, status.get("technical_qa_passed"))
              check("motion spec", status.get("motion_spec_status") == "passed",
                    [status.get("motion_spec_status"), status.get("motion_spec_violations")])
          if (package / "storyboard.json").is_file():
              sb = json.loads((package / "storyboard.json").read_text(encoding="utf-8"))
              check("storyboard dims", (sb.get("width"), sb.get("height")) == (1920, 1080),
                    [sb.get("width"), sb.get("height")])
              check("six scenes", len(sb.get("scenes", [])) == 6, len(sb.get("scenes", [])))
          if (package / "video.mp4").is_file():
              check("video non-empty", (package / "video.mp4").stat().st_size > 0,
                    (package / "video.mp4").stat().st_size)

          print("::error title=failing checks::%s" % (", ".join(failures) or "none"))
          PY
