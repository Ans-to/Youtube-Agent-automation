name: Diagnose e2e (temporary)

# Temporary: reproduces the failing "Verify CEO orchestration and rendered video
# artifacts" step and publishes its error details as annotations, because the
# raw log archive is not reachable from the development sandbox. Deleted once
# the underlying failure is understood.

on:
  push:
    branches: [arena/118abf10-youtube-agent-automation]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r video_studio/requirements-urdu-tts.txt
          cd video_studio
          npm ci

      - name: Download pinned English voice model
        env:
          PIPER_VOICE_REVISION: b145f2ac26522d6a2ccde0164b7b0e48b1e3199c
        run: |
          set -eu
          voice_dir=video_studio/voices/en_US-lessac-medium
          mkdir -p "$voice_dir"
          curl --fail --location --retry 3 --output "$voice_dir/en_US-lessac-medium.onnx" "https://huggingface.co/rhasspy/piper-voices/resolve/$PIPER_VOICE_REVISION/en/en_US/lessac/medium/en_US-lessac-medium.onnx"
          curl --fail --location --retry 3 --output "$voice_dir/en_US-lessac-medium.onnx.json" "https://huggingface.co/rhasspy/piper-voices/resolve/$PIPER_VOICE_REVISION/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json"

      - name: Run the failing end-to-end step
        env:
          PIPER_MODEL: ${{ github.workspace }}/video_studio/voices/en_US-lessac-medium/en_US-lessac-medium.onnx
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import agent
          import dispatch

          root = Path.cwd()
          workspace = root / "workspace"
          workspace.mkdir(parents=True, exist_ok=True)
          (workspace / "ci-source-notes.md").write_text(
              "# Synthetic CI source notes\n\nThis is synthetic test material.\n", encoding="utf-8")
          (workspace / "ci-config.json").write_text(
              json.dumps({"model": {"enabled": False}, "runner": {"max_tasks_per_cycle": 1}}), encoding="utf-8")
          queue = workspace / "ci-task-queue.json"
          queue.write_text(json.dumps([{
              "id": "CI-VIDEO-E2E",
              "kind": "youtube_package",
              "title": "CI template demo render smoke test",
              "input": ("Narration language: English. Create a template demo render MP4 for a faceless YouTube video about "
                        "CI pipeline smoke testing. Generate the video package and render it; "
                        "this is synthetic smoke-test content, not publication content."),
              "context_file": "workspace/ci-source-notes.md",
              "status": "pending",
          }], indent=2), encoding="utf-8")
          agent.TASKS = queue
          agent.CONFIG = workspace / "ci-config.json"
          agent.OUTPUTS = workspace / "ci-outputs"
          dispatch.collect_web_research = None
          print("processed:", agent.cycle("CI-VIDEO-E2E"))
          PY

      - name: Report the failure as annotations
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("workspace/orchestration/task-CI-VIDEO-E2E")

          def announce(title, text):
              text = " ".join(str(text).split())
              print("::error title=%s::%s" % (title, text[:900]))

          manifest = base / "pipeline-status.json"
          if manifest.is_file():
              m = json.loads(manifest.read_text(encoding="utf-8"))
              announce("status", json.dumps({k: m.get(k) for k in ("status", "quality_gate")}))
              for run in m.get("tool_runs", [])[:2]:
                  announce("tool run", json.dumps(run))
              for check in m.get("artifact_checks", [])[:2]:
                  announce("artifact check", json.dumps(check))
          else:
              announce("manifest", "missing: %s" % manifest)

          package = base / "video-production"
          if package.is_dir():
              announce("package", ", ".join(sorted(p.name for p in package.iterdir())))

          log = base / "video-studio-tool.log"
          if log.is_file():
              text = log.read_text(errors="replace")
              announce("log length", len(text))
              tail = text[-4500:]
              for index in range(0, len(tail), 850):
                  print("::error title=log %d::%s" % (index, " ".join(tail[index:index + 850].split())))
          else:
              announce("tool log", "missing")
          PY
