name: Resolve npm lockfile (temporary)

on:
  push:
    branches:
      - security/hardening-2026-10
    paths:
      - ".github/workflows/resolve-npm-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: resolve-npm-lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/hardening-2026-10
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Generate lockfile without running package scripts
        working-directory: video_studio
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile with clean install
        working-directory: video_studio
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit verified lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video_studio/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "Add verified video studio npm lockfile"
          git push origin HEAD:security/hardening-2026-10
